review decks and renewal outcomes (all private, access to confirm).","who":"CS Ops owns the schedule and deck template; CSMs edit and present; the CS manager checks any discount request against the brief.","first":"Briefs and draft decks for the next 10 renewals in one CSM's book, compared with what that CSM would have built by hand and how long it took.","measure":"Days between the first renewal conversation and the contract end date; share of renewals closed with a discount, before and after.","ask":"How far before a contract ends does the renewal conversation usually start, and who starts it?","problems":[{"id":"s2-14","card":"Renewals sneak up on us","statement":"We discover a contract is ending before we've had time to discuss the renewal with the client.","how":"Watches every contract end date and notice deadline, starts renewal prep inside the window your team chooses, and gives the CSM a brief while there's still time.","ask":"Where do contract end dates live today, and who checks them each month?","roles":["Customer success & accounts"]},{"id":"s3-17","card":"Client review decks eat up the week","statement":"Preparing each customer review means gathering the same information and rebuilding slides by hand.","how":"Drafts each review deck on your template from usage, results, tickets and notes, so the CSM checks and edits slides rather than gathering data and rebuilding them by hand.","ask":"Which slides in your review deck do you rebuild every time, and from which systems?","roles":["Customer success & accounts"]},{"id":"s3-18","card":"Discounting every renewal to keep the client","statement":"Price cuts have become the default way to keep clients instead of resolving why they're unsure.","how":"Lists why the client is unsure, from calls, tickets and emails, with a non-price response for each, so the CSM can address the cause before offering a price cut.","ask":"On your last discounted renewal, what was the client actually unsure about?","roles":["Customer success & accounts"]}]},{"id":"A28","name":"Renewal Paperwork Tracker","type":"Workflow","wedge":"W3 (operations)","what":"Tracks each renewal from the client's yes to the signed agreement, showing which approval or document is holding it up, who has it and for how long, so stalled steps get chased early.","how":["A renewal is marked as agreed in the CRM (to confirm)","The workflow lists the approvals and documents it needs, based on its terms and your approval rules","It checks each step's status daily and records who holds it and since when","The renewal owner gets a daily list of stuck steps; automatic reminders to approvers (to confirm) come only after review."],"data":"CRM renewal records and stages, approval records, contract and order form status in the document or e-signature tool, renewal terms such as price changes (all private, access to confirm).","who":"RevOps or the deal desk owns it; the renewal owner chases stuck steps; approvers see what waits on them; the CS leader reviews where time is lost.","first":"A read-only tracker for this quarter's renewals, checked against what the renewals team believes is holding each one up.","measure":"Days from the client's yes to the signed agreement; handoffs per renewal, and where the waiting time sits.","ask":"After a client agrees to renew, which approvals and documents does the agreement pass through before signature?","problems":[{"id":"s3-19","card":"Renewal paperwork takes too many handoffs","statement":"A client is ready to renew, but internal approvals and document handoffs hold up the agreement.","how":"For each client ready to renew, names the approval or document holding up the agreement and who has it, and shows which handoffs most often cause delays.","ask":"Which approval or handoff most often holds up a renewal, and why?","roles":["Customer success & accounts","Revenue & marketing ops"]}]},{"id":"A29","name":"Value Story & Referral Finder","type":"Agent","wedge":"W3","what":"Writes a short, sourced value story for each client from their goals, usage and own words, then spots clients with clear results who have not yet been asked for a referral.","how":["Monthly, the agent reads each client's starting goals, usage trends, survey scores and call notes (sources to confirm)","It writes a value story that separates measured results, client quotes and estimates, and names missing proof","Clients with clear results and recent positive comments go on a referral list with a suggested introduction","The CSM reviews every story and ask before anything reaches the client."],"data":"Stated goals from the sale, product usage, survey scores, call transcripts and emails, past referral asks (all private, access to confirm); public profiles for likely introductions.","who":"CS Ops owns it; CSMs use the value story with clients and make the referral ask; marketing reviews referral and case study candidates.","first":"Value stories for 10 clients the team already sees as happy, checked by each CSM for accuracy, plus a referral list they mark yes, not yet or no.","measure":"Share of value stories CSMs would show a client as is; referral asks made and introductions received.","ask":"Which clients could you show a clear result for today, and have any of them introduced you to someone?","problems":[{"id":"s2-18","card":"Hard to prove our product is worth the money","statement":"When a client asks what they've gained, we struggle to show a clear result from using the product.","how":"Compares the client's starting goals with measured usage and outcomes, adds their own quotes, and marks each gain as proven, estimated or still missing.","ask":"What did clients say they wanted to achieve when they signed, and where is it written down?","roles":["Customer success & accounts"]},{"id":"s4-15","card":"Happy clients. No one asks for referrals.","statement":"We know a client is getting good results but never ask whether they'd introduce us to someone else.","how":"Lists clients with proven results and recent praise who haven't been asked for a referral, plus who they might introduce you to and a draft ask.","ask":"When did you last ask a happy client for an introduction, and what happened?","roles":["Customer success & accounts"]}]},{"id":"A30","name":"Handoff & Success Plan","type":"Agent","wedge":"W3","what":"When a deal closes, collects everything sales promised into a sourced handoff brief, then turns it into a success plan with one named owner per outcome and a monthly check on what has slipped.","how":["A deal is marked won in the CRM (to confirm)","The agent reads its calls, emails, proposal and order form, lists each promise with its source, and flags vague ones for the AE to clarify","It drafts a success plan with outcomes, dates and proposed owners","The AE and CSM approve it at the handoff meeting","Monthly, it checks progress and tells the plan owner what has slipped."],"data":"CRM opportunity, call recordings and transcripts, sales emails, proposals and order forms, onboarding tasks, product usage (all private, access to confirm).","who":"CS Ops or RevOps owns the template; the AE confirms promises; the CSM owns each success plan; onboarding, support and product leads see items assigned to them.","first":"Handoff briefs for the last 10 won deals, reviewed by each AE and CSM for missed or wrong promises before any plan is shared.","measure":"Promises found later that the brief missed; share of success plan items with a named owner and on schedule.","ask":"On your last new client, what had sales promised that CS only learned about later?","problems":[{"id":"s1-18","card":"Sales promises get lost in the handoff","statement":"The team looking after a new client doesn't know what sales promised before the deal was signed.","how":"Reads the deal's calls, emails and proposal for every commitment sales made, and gives the CSM a list with each promise's source and date before the first client meeting.","ask":"Where would a CSM look today to find what sales promised a new client?","roles":["Customer success & accounts","Revenue & marketing ops"]},{"id":"s4-16","card":"No one owns the client's success plan","statement":"Several teams work with the client, but nobody is responsible for coordinating the promised outcomes.","how":"Turns the promised outcomes into one success plan with the CSM as coordinator and a named owner per item, then checks monthly which items are late or unowned.","ask":"When several teams work with one client, who is responsible for the promised outcomes?","roles":["Customer success & accounts","Revenue & marketing ops"]}]},{"id":"A31","name":"Account-Aware Support Signals","type":"Workflow","wedge":"W3 / W5","what":"Matches every support ticket to its client and account owner, ranks open issues by business impact with the reasons shown, and warns sales before anyone pitches a client who is still waiting on a serious fix.","how":["A support ticket opens or changes","The workflow links it to the client account and owner","It rates impact from severity, users affected, time open, repeat issues and renewal date, and explains why","Each account team gets a daily ranked digest of its clients' open issues","Accounts with a serious open issue are marked \"fix first\" in a shared list; CRM write-back (to confirm) only after review."],"data":"Support tickets and status, CRM accounts, owners, open opportunities and renewal dates, product usage by account (all private, access to confirm).","who":"RevOps or Support Ops owns it; CSMs and account managers act on the digest; sales checks the fix-first flag before outreach; the CS leader reviews ratings.","first":"A daily digest for one account team over two weeks, with each impact rating checked against how the CSM would have ranked the same issues.","measure":"Time from a serious ticket opening to the account owner hearing about it; upsell pitches made while a serious ticket was open.","ask":"Thinking of your last serious client issue, when did the account team hear about it, and what did they do?","problems":[{"id":"s2-17","card":"Support tickets never reach the account team","statement":"The people managing a client relationship don't hear about the problems that client reports to support.","how":"Links each ticket to the client account and its owner, and sends that owner a daily digest of what their clients reported and what's still open.","ask":"How does an account manager find out today about a ticket their client opened?","roles":["Customer success & accounts","Revenue & marketing ops"]},{"id":"s3-20","card":"Upsell pitch lands during a support nightmare","statement":"We ask a client to buy more while they're still waiting for us to fix a serious problem.","how":"Marks accounts with a serious open ticket as \"fix first\", so anyone planning to ask that client to buy more sees the problem and waits for the fix.","ask":"What happened the last time someone pitched more to a client still waiting on a fix?","roles":["Customer success & accounts"]},{"id":"s4-18","card":"Every client issue gets marked urgent","statement":"Without a way to judge impact, the account team can't tell which client problems need attention first.","how":"Rates each issue's impact from severity, users affected, time open, repeat history and renewal timing, and shows the reasons, so the account team sees which problems need attention first.","ask":"When every client issue is marked urgent, how does your team decide what comes first?","roles":["Customer success & accounts"]}]},{"id":"A32","name":"Feedback & Recurring Issue Finder","type":"Agent","wedge":"W5 / W3","what":"Reads tickets, calls and messages to group client feedback and problems into themes, so the product team sees what clients ask for, support sees which issues keep coming back, and related tickets are treated as one problem.","how":["Weekly, the agent reads new tickets, call transcripts, chats and survey comments (sources to confirm)","It groups items that describe the same request or problem, across clients and within one client","Each theme gets a count, affected accounts, sample quotes and a likely cause marked as a guess","Product and support leads review the themes; linking tickets in the help desk (to confirm) happens only after review."],"data":"Support tickets, call transcripts, chat and email threads, survey comments, CRM account details and renewal dates, the product team's request list (all private, access to confirm).","who":"Support Ops or CS Ops owns it; product managers review feedback themes; support leads take recurring issues to engineering; agents work grouped tickets as one case.","first":"One month of tickets and call notes grouped into themes, with a support lead and a product manager checking a sample of the groupings by hand.","measure":"Share of themes the product and support leads accept as correctly grouped; new tickets on themes marked fixed, before and after the fix.","ask":"Which client problem or request have you heard about most this quarter, and who is acting on it?","problems":[{"id":"s4-17","card":"Client feedback never reaches the product team","statement":"Useful requests and complaints stay in calls and messages instead of informing product decisions.","how":"Pulls requests and complaints out of calls, emails and tickets into themes with counts, affected accounts and quotes, and gives product managers a monthly list for product decisions.","ask":"How does your product team hear about client requests today, and how often?","roles":["Customer success & accounts"]}]},{"id":"A33","name":"CRM Data Quality Queue","type":"Workflow + dataset","wedge":"W1 (data quality)","what":"Puts likely duplicates and records with blank or inconsistent fields in a review queue, explains each flag and proposes what to keep or fix. It traces each error to the import, form or sync behind it, so the team can fix the source.","how":["Nightly, the workflow compares records on domain, name variants, email and address, and checks required fields","It groups likely duplicates and errors with a confidence level and the reason","It proposes a surviving record or fix, and tags the import, form or sync that caused it","An ops owner approves; nothing merges automatically in version one","A weekly summary ranks error sources, each with a proposed prevention rule."],"data":"CRM company and contact objects, plus import, form and sync history (read access to confirm); public company domains to settle conflicts.","who":"RevOps or Marketing Ops reviews the queue; the systems admin confirms merge and prevention rules; owners of each import, form or sync apply the fixes.","first":"A read-only report of the top 200 duplicate groups and the sources that created them, with a sample checked by hand for accuracy.","measure":"Duplicates found and resolved per week; hours spent on manual cleanup, before and after prevention rules go in.","ask":"Who spends time on CRM cleanup each week, and where do most bad records come from?","problems":[{"id":"s1-01","card":"Too many dupes in the CRM","statement":"The same person or company has several records, so activity gets split and work gets repeated.","how":"Groups likely duplicate companies and contacts, explains each match, and proposes one surviving record, so split activity is combined once an ops owner approves the merge.","ask":"When two records disagree, which system or field do you trust?","roles":["Revenue & marketing ops"]},{"id":"s4-06","card":"CRM cleanup is someone's full-time job","statement":"Keeping records usable takes constant manual work instead of a process that prevents the errors.","how":"Ranks the imports, forms and syncs creating the most errors and proposes a rule for each, such as a duplicate check before import, for the admin to approve.","ask":"If you could block one kind of bad record at entry, which would it be?","roles":["Revenue & marketing ops"]}]},{"id":"A34","name":"Lead Source & Data Vendor ROI","type":"Dataset","wedge":"W1 (operations)","what":"Builds one table of every lead source and contact data vendor, showing what each costs, which records it adds that you don't already own, and which customers it actually brought in, so budget and renewal decisions rest on evidence.","how":["Monthly and before renewals, spend and the paying team for each source and vendor come in from finance (to confirm)","Each vendor's contacts are matched against the CRM and the other vendors to measure overlap","Leads are traced from their recorded source to meetings, opportunities and closed deals","The table shows cost, new records, pipeline and customers per source, and flags leads whose source is missing or unclear."],"data":"Spend and contracts for each data vendor and paid source; CRM leads, contacts and opportunities with their source fields; vendor exports or samples (all private, access to confirm).","who":"RevOps or Marketing Ops owns it; finance confirms spend; marketing and sales leaders use it for budget and vendor renewal decisions.","first":"Last year's closed deals traced back to their lead sources, plus two contact databases checked against the CRM for overlap, reviewed with finance before any renewal.","measure":"Share of lead source spend tied to known pipeline and customers; overlapping data spend found before renewal.","ask":"Which lead source or data vendor renews next, and what would you need to see to cut or keep it?","problems":[{"id":"s3-07","card":"Paying for contact data we already have","statement":"Different teams buy access to overlapping contact databases without knowing what we already own.","how":"Matches each vendor's contacts against the CRM and the other databases, and lists who pays for what, so a team sees what's already owned before buying more.","ask":"How many teams buy contact data separately, and who knows about every contract?","roles":["Revenue & marketing ops"]},{"id":"s4-03","card":"No idea which lead sources are worth paying for","statement":"We can't connect what we spend on a lead source to the customers it actually brings in.","how":"Follows each lead from its recorded source to opportunities and closed deals, so spend per source sits next to the customers it produced, with unclear sources flagged.","ask":"Where is lead source recorded today, and how much do you trust that field?","roles":["Revenue & marketing ops"]}]},{"id":"A35","name":"Record Reconciler","type":"Workflow + dataset","wedge":"Platform / operations","what":"Lines up each system's version of a disputed number, record or transaction, explains the likely reason they differ, and shows which value looks current. Settled answers build a shared list of which system and definition to trust for each number and field.","how":["Someone flags a disputed number, record or payment, or a scheduled check finds one","The workflow pulls that item from each system","It compares them field by field and names each gap's likely cause: definitions, timing, filters or entry errors","It shows the likely current value, with update times and what's still unknown","The owner confirms and the answer joins the trusted-source list; nothing is corrected automatically in version one."],"data":"Records and change history from the CRM, billing, finance reports, dashboards and payment systems; written metric definitions where they exist (all private, access to confirm).","who":"RevOps or Business Systems owns it; finance or payment operations reviews payment cases; the owner of each metric or system makes the final call.","first":"One disputed metric, such as last quarter's closed revenue, reconciled across two systems, plus 20 recent mismatched records or payments, with each explanation checked by its owner.","measure":"Time from spotting a mismatch to an agreed answer; share of explanations the system owner confirms as correct.","ask":"When two systems give different answers, who decides which is right, and how long does that take?","problems":[{"id":"s4-24","card":"Same sales metric. Three different answers.","statement":"Different systems report different results for the same number, so nobody knows which one to trust.","how":"Breaks the disputed number down in each system and shows whether the gap comes from definitions, date ranges, filters or missing records, so everyone uses one agreed figure.","ask":"Which number gets argued about most in your pipeline or forecast meetings?","roles":["Revenue & marketing ops"]},{"id":"t-09","card":"Two systems disagree on the same record","statement":"We have to investigate which system has the current information before we can act.","how":"Lays out each system's value side by side, with when it last changed and which user or sync changed it, so the team can act without investigating first.","ask":"Which system wins today when records disagree, and is that rule written down?","roles":["Systems & AI"]}]},{"id":"A36","name":"Cross-Tool Sync","type":"Workflow","wedge":"Platform","what":"Carries updates from one tool to another so people stop pasting the same information by hand. It starts as proposed updates a person approves, then moves to automatic syncing only for fields the team has reviewed and trusts.","how":["A change lands in the source tool, such as a deal closing or a ticket being escalated","The workflow maps the changed fields to the destination tool using the owner's approved mapping","It drafts the update with before and after values, and flags a conflict where the destination has newer data","A person approves updates in a batch, and each is logged; automatic sync is proposed per field only after review."],"data":"Read access to the source and destination tools, such as the CRM, support desk, billing and shared spreadsheets (to confirm); write access only after review (to confirm); the agreed field mapping.","who":"RevOps or Business Systems owns the field mappings; the people who used to copy the data approve updates; system admins sign off on write access.","first":"One copy-paste task, such as closed deals into the onboarding tracker, run for two weeks as proposed updates only and compared with what people pasted by hand.","measure":"Hours spent copying data between tools, before and after; share of proposed updates approved unchanged.","ask":"If one copy-paste task disappeared tomorrow, which would save your team the most time?","problems":[{"id":"s2-25","card":"Copying the same data from tool to tool","statement":"We manually paste information between systems because updates don't carry across automatically.","how":"Watches the source tool for the exact updates people now paste by hand and drafts the matching change in the destination tool, so nobody has to retype it.","ask":"Which update do you copy by hand because the existing integration doesn't carry it across?","roles":["Revenue & marketing ops","Systems & AI"]}]},{"id":"A37","name":"Integration Health Monitor","type":"Workflow","wedge":"Platform","what":"Checks that every integration and automation ran, moved its usual amount of data and put it in the right fields. When one fails or a connected tool changes, it alerts the named owner with what changed and which records were affected.","how":["On a schedule, the workflow reads run logs for each automation and integration","It flags missed runs, errors and unusual record counts","It compares each connected tool's fields with the last working snapshot, samples synced records for values in the wrong field, and reads vendors' public release notes","It alerts the named owner with what changed, when it started and which records were affected; nothing is repaired automatically in version one."],"data":"Run logs and error histories from automation and integration tools, field definitions and samples of synced records (all private, access to confirm); vendors' public release notes and changelogs.","who":"GTM Engineering or Business Systems owns it; each automation's named owner receives alerts and fixes the cause; RevOps reviews a weekly health summary.","first":"Watch the five automations the team relies on most for two weeks, sending alerts to one channel, and compare the alerts with problems people reported themselves.","measure":"Time from a failure to its owner knowing; share of failures the monitor caught before a user reported them.","ask":"When an automation last broke, how long did it take before anyone noticed, and who noticed?","problems":[{"id":"s3-23","card":"One app update breaks the whole workflow","statement":"A small change in a connected tool stops an automated task that was working yesterday.","how":"Compares each connected tool's fields and settings with the last working snapshot, so a renamed field or changed option is tied to the exact automation it stopped.","ask":"Which connected tool updates most often, and what broke the last time it changed?","roles":["Revenue & marketing ops","Systems & AI"]},{"id":"t-08","card":"Failed automations disappear without an alert","statement":"A workflow stops running, but the team does not hear about the failure.","how":"Tracks each automation's expected schedule and normal volume, and alerts its named owner when a run is missing, fails or moves far fewer records than usual.","ask":"Which automations would hurt most if they stopped quietly for a week?","roles":["Systems & AI"]},{"id":"t-18","card":"An integration update breaks our field mappings","statement":"After a system update, information lands in the wrong fields or stops syncing.","how":"Samples newly synced records for values in the wrong field or blanks where data used to arrive, and points to the mapping change that likely caused it.","ask":"Which field mappings matter most, and who checks them after a system update?","roles":["Systems & AI"]}]},{"id":"A38","name":"Automation Registry & Owner Check","type":"Workflow + dataset","wedge":"Platform","what":"Keeps one list of every automation and AI workflow, each with a named owner, a backup and a review date. It flags anything without an owner and asks owners on schedule to confirm each one still does the right job.","how":["Weekly, the workflow lists automations and AI workflows in each tool, with creator, last edit and what each reads and writes","It proposes an owner from that history, and team leads confirm an owner and backup","It flags any workflow running without an owner, purpose or review date, and owners who have left","On each review date, the owner sees recent outputs and confirms, updates or retires the workflow."],"data":"Automation and AI workflow lists, run histories, edit logs and recent outputs from each tool, plus the staff directory for owners and leavers (all private, access to confirm).","who":"GTM Engineering or Business Systems owns the registry; team leads confirm owners; each owner reviews their automations on schedule and fixes or retires them.","first":"A registry of the automations in one tool, with owners proposed from creator and edit history, confirmed by team leads, and every entry still without an owner flagged.","measure":"Share of automations with a confirmed, current owner; share of scheduled reviews completed on time.","ask":"How many automations are running right now, and could you name an owner for each one?","problems":[{"id":"t-01","card":"Nobody knows who owns the broken automation","statement":"A workflow fails, but nobody knows who is responsible for fixing it.","how":"Each automation has a confirmed owner and backup in the registry, so a failure goes straight to a named person, and owners who leave are flagged for reassignment.","ask":"When something broke last, how long did it take to find who built it?","roles":["Systems & AI"]},{"id":"t-06","card":"New AI tools. No plan to maintain them.","statement":"Teams launch AI workflows without assigning anyone to keep them working.","how":"Registering a new AI workflow requires an owner, a purpose and a review date, and the weekly scan tells team leads about any workflow running without them.","ask":"When the person who built an AI workflow changes roles, what happens to it?","roles":["Systems & AI"]},{"id":"t-16","card":"No one checks whether the automation still works","statement":"A workflow keeps running after the business process changes, with no owner checking its output.","how":"On each review date, the owner sees a sample of recent outputs next to the purpose recorded at launch, and confirms, updates or retires the automation.","ask":"Which automations are still running from a process your team has since changed?","roles":["Systems & AI"]}]},{"id":"A39","name":"Tool & Workflow Overlap Audit","type":"Dataset","wedge":"Platform","what":"Builds one inventory of the company's tools and automations, groups the ones doing the same job, and shows cost, active users and what depends on each, so teams decide what to keep with evidence.","how":["Quarterly, or before a renewal, the audit collects each tool's cost, seats, active users and the automations built in it","It groups tools and automations by the job they do, such as enriching new leads","Each group shows owners, usage, cost and what would break if one were removed","Owners decide what to merge, keep or cancel; time saved is labeled an estimate unless measured."],"data":"Contracts and spend from finance; seat and sign-in data from admin consoles or single sign-on; automation lists and run histories from each tool (all private, access to confirm).","who":"Business Systems or IT owns it; finance reviews spend; team leads confirm what each tool and automation is for before anything is cut or merged.","first":"An audit of one function's tools and automations, such as sales and marketing, checked with each tool owner before any decision.","measure":"Overlapping tools and duplicate automations found; spend reviewed with usage evidence before each renewal.","ask":"Who decides today whether a tool or automation stays, and what evidence do they use?","problems":[{"id":"t-02","card":"The same workflow built in three tools","statement":"Different teams maintain separate automations for the same task.","how":"Groups automations by the job they do, so separate versions of the same task appear side by side with owners and outputs, and teams can agree which to keep.","ask":"Which task do you suspect is automated more than once across teams?","roles":["Systems & AI"]},{"id":"t-07","card":"Hard to tell which tools are worth keeping","statement":"We pay for overlapping tools without a clear view of who uses them or what they save.","how":"Lines up each tool's cost, paid seats against active users, and how often its workflows run, with time saved labeled as an owner's estimate until measured.","ask":"Which tool renewal comes up next, and who would notice if it disappeared?","roles":["Systems & AI"]}]},{"id":"A40","name":"AI Spend Monitor","type":"Workflow + dataset","wedge":"Platform","what":"Tracks AI usage costs daily by workflow, team and model, warns the owner when spend moves outside its normal range, and explains what drove each change before the invoice arrives.","how":["Daily, the workflow collects usage and cost from each AI provider and tool","It assigns spend to a workflow, team and model using run logs","It compares each against its normal range and budget","When spend jumps, it warns the owner with the likely driver, such as more runs, longer inputs or a model change, and marks what's unconfirmed","A weekly summary goes to finance and Business Systems."],"data":"Usage and billing data from AI providers and tools, agent run logs with workflow, model and volume, and team budgets (all private, access to confirm).","who":"Business Systems or GTM Engineering owns it; finance reviews the weekly summary; workflow owners act on warnings about their own workflows.","first":"Last three months of AI usage broken down by workflow and model, with each past cost jump explained, before any live warnings are turned on.","measure":"Days between a cost increase starting and its owner being warned; share of AI spend tied to a named workflow and owner.","ask":"Who sees the AI bill first, and what can they tell from it today?","problems":[{"id":"s1-25","card":"Why did our AI bill jump?","statement":"Usage costs change without a clear warning or explanation of what drove the increase.","how":"Ties each jump to the workflow, model or team behind it, such as a new agent or longer inputs, and warns the owner on the day it begins.","ask":"When the AI bill last jumped, how long did it take to find the cause?","roles":["Systems & AI"]}]},{"id":"A41","name":"Permission Parity Check","type":"Workflow","wedge":"Platform","what":"Compares who can access what across every tool, including AI tools, with what each person's current role allows. It flags leavers with live accounts, AI connections that see more than their users, and roles with different access in different tools.","how":["Weekly, and whenever HR records a leaver or role change (to confirm)","The workflow pulls users, roles and permissions from each tool and the staff directory","It checks each person's access against their role, and each AI tool's access against the people using it","It lists mismatches by tool, with the evidence and anything unclear","Tool admins review the list; access is removed only after a person approves."],"data":"User, role and permission lists from each tool's admin settings, AI tool connection settings, and the HR directory of joiners, movers and leavers (all private, access to confirm).","who":"IT or Business Systems owns it; each tool's admin reviews flags; managers confirm what their people need; security approves access removals.","first":"A read-only access table for five core tools checked against the HR leaver list, plus one AI tool's connections, with every flag reviewed by that tool's admin.","measure":"Leavers with active access found and removed; days from a role change to matching access in every tool.","ask":"Is there one place where you can see who, including AI tools, can access what across your systems?","problems":[{"id":"s2-23","card":"Our AI can see data it shouldn't","statement":"An AI tool can access customer or company information that the person using it isn't allowed to see.","how":"Compares what each AI tool's connection can read with its users' own permissions, flags customer or company data they couldn't open, and proposes a narrower connection for approval.","ask":"Do your AI tools connect through a shared admin account or through each user's own access?","roles":["Systems & AI"]},{"id":"t-05","card":"Old employees still have access to our tools","statement":"People who left the company still have active accounts or permissions.","how":"Checks every tool's active accounts against the HR leaver list each week, so departed people with live access appear on one review list for removal.","ask":"If someone left today, how would you confirm they lost access to every tool?","roles":["Systems & AI"]},{"id":"t-13","card":"Permissions are different in every tool","statement":"Keeping the right people and workflows connected requires separate access checks in each tool.","how":"Pulls access for people and workflows from every tool into one table by role, showing where the same role differs, so one review replaces separate checks per tool.","ask":"How many tools do you check by hand when someone joins, moves teams or leaves?","roles":["Systems & AI"]}]},{"id":"A42","name":"AI Tool Intake Review","type":"Workflow","wedge":"Platform","what":"Gives every new AI tool one short intake before purchase. It pre-fills the security review from the vendor's public documents and past reviews, records which data the tool may touch, and keeps a published list of approved tools for each data type.","how":["A team requests an AI tool before purchase","The workflow pre-fills the security questions from past reviews and the vendor's public security, privacy and subprocessor pages, citing each source and marking gaps","It lists the systems and data types the tool would touch","Security decides, and the approved-tools list notes which data each tool may use","Monthly, expense and sign-in records are checked for AI tools that skipped intake."],"data":"Vendors' public security, privacy and subprocessor pages; past security reviews, the approved-tools list, and expense or sign-in records (all private, access to confirm).","who":"Security or IT owns it; Business Systems runs the intake; the requesting team fills the gaps; security makes the final call.","first":"Run the next three AI tool requests through intake, and back-test it on one past review to compare the pre-filled answers with the reviewer's own.","measure":"Days from request to decision; share of pre-filled answers reviewers accept unchanged.","ask":"What happens today between someone wanting a new AI tool and security approving it?","problems":[{"id":"t-03","card":"AI tools bought before anyone checks access","statement":"A team buys an AI tool before checking which company data it needs to access.","how":"Intake asks which systems and data types the tool will connect to before anyone buys it, so access is checked while the team can still choose a different tool.","ask":"How do you usually find out a team has bought a new AI tool?","roles":["Systems & AI"]},{"id":"t-14","card":"Sensitive data ends up in the wrong AI tool","statement":"People paste private company or customer information into tools that were not approved for it.","how":"Publishes which approved AI tool fits each data type, and checks expense and sign-in records for unapproved AI tools (to confirm), so users get pointed to an approved option.","ask":"When someone needs AI help with customer data, which tool are they supposed to use?","roles":["Systems & AI"]},{"id":"t-15","card":"Every AI vendor needs another security review","statement":"Each new AI tool starts another round of questions about data, access and vendor controls.","how":"Pre-fills the standard security questions from the vendor's public documents and earlier reviews, with a source for each answer, so reviewers only check what's new or missing.","ask":"Which security questions do you ask every AI vendor, and where do past answers live?","roles":["Systems & AI"]}]},{"id":"A43","name":"Model Portability Kit","type":"Workflow + dataset","wedge":"Platform","what":"Stores each AI workflow's instructions, examples and test cases separately from any one model, then reruns those tests on a new model, so switching means fixing only the steps that broke, without starting over.","how":["A team wants to try a new model or provider","The kit runs each workflow's stored instructions and test cases, built from real past inputs with approved answers, on the current and the candidate model","It compares outputs side by side for accuracy, format and cost, flagging steps that changed","The owner adjusts only the flagged instructions and approves the switch one workflow at a time; nothing moves automatically."],"data":"Current workflow instructions, examples and outputs; real past inputs with approved answers; test runs on current and candidate models (all private, access to confirm).","who":"GTM Engineering or the AI lead maintains the kit; each workflow owner reviews comparisons and approves any switch; finance sees the cost difference.","first":"One workflow's instructions and 30 real past cases moved into the kit, then run on the current model and one alternative, compared side by side before any switch.","measure":"Hours to move a workflow to a new model; share of test cases that still match approved answers after the move.","ask":"If your current model provider raised prices tomorrow, how many workflows would you have to rebuild?","problems":[{"id":"s3-24","card":"Switching AI models means starting over","statement":"Moving to a different model provider means rebuilding workflows we already invested time in.","how":"Reruns each workflow's saved test cases on the new provider's model and shows which steps now fail, so the team fixes those steps and keeps the rest.","ask":"Which workflow would be hardest to move to another model, and why?","roles":["Systems & AI"]}]},{"id":"A44","name":"AI Change Ledger & Safety Controls","type":"Workflow + dataset","wedge":"Platform","what":"Keeps a plain-English record of every change an AI agent proposes or makes, so the team can see what changed, why, from which sources, and roll it back. Retries safely finish the first record, and one switch stops an agent making incorrect changes.","how":["Every proposed change is logged with an action ID, before and after values, reasoning and sources","Retries check that ID and finish the original record","High-impact changes wait in a review queue for human approval","A pause switch, checked before every write, lets the owner stop the agent, which also pauses itself if rejections pass a set limit","A weekly summary shows volume, approvals, rejections, reversals and pauses."],"data":"Agent run records, including failed runs and retries, and the target systems' records and change history (access to confirm per system).","who":"GTM Engineering or Business Systems owns it; RevOps approves high-impact changes; the workflow owner or a named backup can flip the pause switch; security reviews the ledger.","first":"Ledger, review queue, retry check and pause switch for one agent with suggestions only, plus a timed stop drill and a replay of past retries. Nothing writes back until the ledger has been checked.","measure":"Share of AI changes logged with complete reasoning and sources; time to stop, trace and undo a bad change.","ask":"If an AI tool changed a field wrongly today, how would you find out?","problems":[{"id":"t-04","card":"No record of what the AI changed","statement":"We cannot trace which records an AI workflow edited or why it edited them.","how":"Look up any record to see each AI edit with its before and after values, reasoning and sources, or list everything one workflow changed.","ask":"Which records or fields do your AI workflows edit today, and does any log say why?","roles":["Systems & AI"]},{"id":"t-11","card":"An AI retry creates duplicate records","statement":"Retrying a failed AI action adds a second record instead of safely finishing the first.","how":"Each action gets an ID in the ledger before it runs; a retry checks that ID first and picks up where the failed attempt stopped, on the same record.","ask":"Are your retries automatic or manual, and how do you find the duplicates they leave behind?","roles":["Systems & AI"]},{"id":"t-12","card":"No easy way to stop a bad AI action","statement":"When an AI workflow starts making incorrect changes, stopping it takes too long.","how":"One pause switch, checked before every write, halts the agent before its next change; the agent also pauses itself if rejections or change volume pass a set limit.","ask":"Last time an AI workflow went wrong, who stopped it, and how long did that take?","roles":["Systems & AI"]}]},{"id":"A45","name":"Agent Evaluation & Pilot Scorecard","type":"Workflow + dataset","wedge":"Platform","what":"Tests an AI agent on real, messy past work before launch and after every change. A scorecard agreed before the pilot starts shows accuracy and whether checking the output takes less time than doing the task by hand.","how":["Before the pilot, the team agrees a baseline and success measures, and saves real past cases, exceptions included, with the accepted answer","Every agent change reruns all saved cases and scores them against those answers","Reviewers check only cases that failed or changed","In live use, reviewers mark each output used as is, edited or redone, with minutes spent","A weekly scorecard compares accuracy and review time with the baseline."],"data":"Real past cases and the answers the team accepted (to confirm); agent outputs; reviewer marks and minutes; time per task done by hand, as the baseline.","who":"The team running the pilot owns the scorecard; GTM Engineering maintains the test cases; reviewers mark each output; a named sponsor decides whether to expand, fix or stop it.","first":"One agent and 50 real past cases, messy ones included. Score the current version, agree the scorecard, then run two weeks with every output reviewed and marked used as is, edited or redone.","measure":"Review and correction minutes per output against doing the task by hand; share of real cases, exceptions included, the agent gets right.","ask":"Which AI tool are you testing now, and how do you decide whether its output is good enough?","problems":[{"id":"s1-24","card":"The AI demo works. The real workflow doesn't.","statement":"The demo handles a neat example but fails when real work brings exceptions and messy data.","how":"The agent is scored on real past cases, including exceptions and messy data, before launch; each new exception found in live use is added to the set.","ask":"What was the first real case that broke the demo, and what made it different?","roles":["Sales & prospecting","Marketing & growth","Customer success & accounts","Revenue & marketing ops","Strategy & market intelligence","Systems & AI"]},{"id":"s4-23","card":"Our AI creates more work than it saves","statement":"Reviewing and correcting the tool's output takes longer than doing the task ourselves.","how":"Reviewers log minutes and mark each output used as is, edited or redone; tasks where checking takes longer than doing them by hand get fixed or returned to people.","ask":"Which AI output do you correct most, and is fixing it slower than doing it yourself?","roles":["Sales & prospecting","Marketing & growth","Customer success & accounts","Revenue & marketing ops","Strategy & market intelligence","Systems & AI"]},{"id":"t-10","card":"Testing AI changes takes too much manual work","statement":"Every change to an AI workflow needs repeated manual checks before we can trust it.","how":"Every change to a prompt, model or step reruns all saved cases and shows what got better or worse, so people only review the results that changed.","ask":"What do you check by hand after each change, and how long does one round take?","roles":["Systems & AI"]},{"id":"t-19","card":"The AI pilot has no clear measure of success","statement":"We launched a pilot without agreeing how to check whether it actually helps the team.","how":"The team agrees a baseline, two or three measures, a decision date and owner, even mid-pilot; the scorecard then fills in weekly from reviewer marks and test results.","ask":"What result would make you expand this pilot, and what would make you stop it?","roles":["Systems & AI"]}]},{"id":"A46","name":"Show-Your-Work Answers","type":"Agent standard","wedge":"Platform","what":"A standard every agent follows: each answer lists the steps and actions taken, links every fact to the record or page it came from, and marks what is inferred or unknown, so anyone can check it.","how":["As an agent runs, it logs each step in plain English: searches, records read, actions taken","Its answer tags each fact with the link or record ID used, marks what is inferred and lists what is still unknown","A checking pass flags any fact with no source, or a source that does not support it","The answer, step log and sources are saved together for later review."],"data":"Each agent's step log and saved answers; the public pages and internal records it reads, such as CRM fields, notes or tickets (access to confirm per system).","who":"GTM Engineering or Business Systems sets the standard and checks new agents against it; anyone reading an answer can check its sources; team leads review flagged answers.","first":"Apply the standard to one agent already in use. Two users check 20 answers each: can they follow the steps, and does every fact have a source that supports it?","measure":"Share of sampled answers where every fact has a source that supports it; minutes to trace an answer back to its records.","ask":"When an AI tool gives you an answer today, what do you do to check it?","problems":[{"id":"s1-23","card":"Hard to check what the AI is doing","statement":"We can't easily see the steps an AI tool is taking or the actions it has already carried out.","how":"Each run keeps a plain-English step log, with times, of what it searched, read, changed or sent, so anyone can see what it has already done.","ask":"When an AI tool acts for you, how do you find out what it actually did?","roles":["Sales & prospecting","Marketing & growth","Customer success & accounts","Revenue & marketing ops","Strategy & market intelligence","Systems & AI"]},{"id":"s3-25","card":"AI answers without a source to check","statement":"The tool gives a confident answer but doesn't show where its facts came from.","how":"Every fact links to the page or record it came from, guesses are labeled as guesses, and facts with no supporting source get flagged.","ask":"Which AI answer did your team act on and later find was wrong?","roles":["Sales & prospecting","Marketing & growth","Customer success & accounts","Revenue & marketing ops","Strategy & market intelligence","Systems & AI"]},{"id":"t-17","card":"Hard to explain where an AI answer came from","statement":"We cannot trace an AI answer back to the source records it used.","how":"Each saved answer keeps the record IDs, fields and values it used at the time, so anyone can trace it back, even after the records change.","ask":"Who asks your team to show the records behind an AI answer: managers, auditors or customers?","roles":["Systems & AI"]}]},{"id":"A47","name":"Shared Team Agents","type":"Workflow","wedge":"Platform","what":"Turns a useful personal AI tool into a shared team agent with a named owner, clear inputs and plain-English settings, so teammates can run it and the owner can make small changes without waiting for an engineer.","how":["A teammate nominates a personal prompt or tool that works","It is rebuilt as a team agent with its inputs, steps, data access and owner written down, plus plain-English settings for instructions, templates and lists","Teammates run it from a shared team list, each with their own access (to confirm)","Setting changes are tested on saved examples and approved by the owner; only new connections or permissions need an engineer."],"data":"The original tool's prompt, steps and sample outputs; the data it needs, such as CRM or shared drives (access to confirm); saved test examples; each team member's existing permissions (to confirm).","who":"The builder or a business owner owns each agent and its settings; GTM Engineering approves new connections and access; teammates run it and report problems to the owner.","first":"One personal tool colleagues already ask for, rebuilt as a shared agent for one team, with no automatic actions. Log each change request, how long it took and whether an engineer was needed.","measure":"Weekly users of the shared agent beyond its builder; days from a small change request to the change going live.","ask":"Which useful AI tool or automation on your team depends on one person to run or change?","problems":[{"id":"s2-24","card":"One person's AI tool. Nobody else can use it.","statement":"A teammate builds something useful, but sharing it with everyone else is difficult or impossible.","how":"The tool moves off the builder's personal account into a team agent with documented inputs and an owner, so colleagues run it with their own access.","ask":"What did a teammate build that others asked to use, and what stopped them?","roles":["Sales & prospecting","Marketing & growth","Customer success & accounts","Revenue & marketing ops","Strategy & market intelligence","Systems & AI"]},{"id":"s4-25","card":"Every simple automation needs an engineer","statement":"Even a small change to an everyday workflow has to wait for technical help.","how":"Instructions, templates, lists and thresholds sit in plain-English settings the business owner edits; each change is tested on saved examples, and only new connections need an engineer.","ask":"Which small workflow change did you last need an engineer for, and how long was the wait?","roles":["Sales & prospecting","Marketing & growth","Customer success & accounts","Revenue & marketing ops","Strategy & market intelligence","Systems & AI"]}]},{"id":"A48","name":"Client & Market Change Monitor","type":"Agent","wedge":"W4","what":"Watches clients, target companies and their industries for meaningful changes, from leadership moves to new regulations. It links each change to your relationships and the clients it affects, and tells the right owner what to do while there is time.","how":["Daily, the agent reads announcements, news, filings, public profiles and long reports on watchlist companies and their industries","It verifies each change against a second source","It links each change to your relationships, and matches industry news to clients by sector, region and product","It writes a short note: what happened, what it may mean, what's unknown and a suggested next step","Each note goes only to the named owner."],"data":"Public news, press releases, filings, company pages and profiles; long reports the team already receives (to confirm); the firm's watchlist, owner list, client sectors and CRM contacts (to confirm).","who":"BD or practice leads own the watchlist; a market intelligence analyst checks industry-to-client matches; partners or account owners act on the notes.","first":"First, replay last quarter's news for 50 companies and two industries to see what it would have caught early. Then a weekly digest for one team, plus same-day notes for chosen change types.","measure":"Client changes and executive moves caught before anyone mentions them; follow-ups started from a note.","ask":"Which client changes would you want to hear about the same day?","problems":[{"id":"m-01","card":"Client news gets noticed after the opportunity passes","statement":"We hear about a meaningful change at a client too late to start a useful conversation.","how":"Daily checks catch acquisitions, restructurings, expansions and funding while still fresh; urgent types reach the owner the same day with a suggested reason to call.","ask":"Which recent client change did you hear about too late, and how did you find out?","roles":["Strategy & market intelligence"]},{"id":"m-02","card":"Executive moves get lost in the news feed","statement":"A key person changes jobs, but nobody connects the move to our client relationships.","how":"Each verified move is matched to your relationships at the person's old and new company, and the owner gets a note on what it means and what to do.","ask":"When a client executive moves, who at your firm usually hears first, and how?","roles":["Strategy & market intelligence"]},{"id":"m-09","card":"Important client changes disappear in long reports","statement":"A useful change is buried in a report that the relationship owner does not have time to read.","how":"The agent reads long reports for the owner and pulls out only the changes about their clients, each in a few lines with the page it came from.","ask":"Which long reports do relationship owners receive but rarely have time to read?","roles":["Strategy & market intelligence"]},{"id":"m-11","card":"Industry news isn't linked to the clients it affects","statement":"We spot a market change but do not identify which clients might need a conversation about it.","how":"Each market change, such as a new regulation, is matched to clients by sector, region and product, with a one-line reason why each client might care.","ask":"Think of a recent market change: which clients should have heard from you about it?","roles":["Strategy & market intelligence"]}]},{"id":"A49","name":"Shared Watchlist & Follow-up Owner","type":"Workflow","wedge":"W4","what":"Merges everyone's separate client watchlists into one shared list with a named owner per client, gives every client update one owner and a suggested next step, and tracks each follow-up until it is done.","how":["Each partner's watchlist is merged into one list, flagging clients several people track","The practice lead confirms one relationship owner per client","Each alert, or update forwarded to a shared channel (to confirm), is matched to the list and given that owner plus a suggested next step","The owner accepts, passes it on or marks it not relevant","Open follow-ups appear in a weekly review until closed."],"data":"Each partner's watchlist, the firm's client and owner lists, CRM contacts, news alerts the team already receives, and updates forwarded to a shared channel (all to confirm).","who":"BD or practice leads own the shared list, settle ownership and run the weekly review; partners and account owners act on their follow-ups.","first":"Merge three or four partners' watchlists for one practice and show the overlaps. For four weeks, the practice lead confirms each alert's proposed owner and next step, and reviews open items weekly.","measure":"Time from an update arriving to an owner accepting it; share of follow-ups closed with an outcome.","ask":"When client news reaches the team today, how do you decide who follows up?","problems":[{"id":"m-03","card":"Market alerts arrive without a next step","statement":"The team receives a relevant update without knowing who should act or what to do next.","how":"Every alert arrives with one proposed owner, taken from the shared list, and a suggested next step, such as a call, an email or a briefing note.","ask":"Which alerts do you get today, and what usually happens after one arrives?","roles":["Strategy & market intelligence"]},{"id":"m-04","card":"Every partner keeps a separate client watchlist","statement":"People track the same clients independently, so useful changes and follow-ups stay scattered.","how":"Each partner's list is merged into one shared watchlist that shows who tracks each client, so changes and follow-ups sit in one place for everyone.","ask":"How many people track the same top clients today, and where do they keep their lists?","roles":["Strategy & market intelligence"]},{"id":"m-05","card":"No clear owner for following up on client news","statement":"A meaningful client update is shared around the team, but nobody owns the response.","how":"Even an update forwarded around the team gets one named owner who accepts, passes on or closes it; anything left open is raised in the weekly review.","ask":"Think of the last client news someone forwarded to the group: who followed up, if anyone?","roles":["Strategy & market intelligence"]}]},{"id":"A50","name":"Relationship Map","type":"Agent + dataset","wedge":"W4","what":"Builds a searchable map of who at your firm knows whom at each client or prospect, with the evidence and date of the last contact, so anyone can find relationship history and ask for a verified warm introduction.","how":["Weekly, the agent reads who emailed or met whom and when (no message content), CRM contacts and past projects (all to confirm), plus public profiles","It records each connection with how they know each other, how often and when they last spoke, marking inferred links unconfirmed","Anyone can ask who knows someone at a company and see the strongest connections first","The colleague confirms before any introduction is requested."],"data":"Email and calendar metadata showing who met or wrote to whom and when, CRM contacts and activity, past project or deal records (all to confirm); public profiles for shared employers and boards.","who":"BD or practice leads own the map; security approves which mailboxes are read; anyone preparing outreach searches the map; colleagues confirm or correct their own connections.","first":"Map relationships at 30 target accounts using CRM data and the calendars of five volunteers. The volunteers mark each connection shown as right, wrong or outdated.","measure":"Minutes to find who knows someone at a target company; warm introductions made from the map.","ask":"How do you find out today who at your firm already knows someone at a target account?","problems":[{"id":"m-06","card":"Relationship history is buried in old emails","statement":"Before contacting a client or prospect, we struggle to find the history of who knows whom.","how":"Anyone can look up which colleagues have met or written to a contact, how often and when last, along with the related project or deal, without searching old emails.","ask":"Where does your relationship history live today: inboxes, the CRM, or people's heads?","roles":["Strategy & market intelligence"]},{"id":"m-12","card":"Warm introductions depend on someone's memory","statement":"We miss useful introductions because relationship connections are not easy to find or verify.","how":"For each target account, the agent lists colleagues with a connection, the evidence and last contact date; the colleague confirms before an introduction is requested.","ask":"Which introduction did you miss recently because nobody remembered the connection in time?","roles":["Strategy & market intelligence"]}]},{"id":"A51","name":"Sourced Research Library","type":"Dataset + agent","wedge":"W4","what":"Keeps one shared library of market findings, each traced to its original source with date and context, so teams check what is already known before starting new research and every summary shows the evidence behind its claims.","how":["Someone asks a market question or adds a finding","The agent searches the library first and returns existing answers with sources and dates","New claims are traced back to the original report or data, with date, scope and method","Each finding is saved with the question it answers and who asked","Summaries cite every claim with its source and context, and flag any claim that could not be traced."],"data":"Public reports, filings, surveys and articles; the team's existing research files and past summaries (to confirm); paid research subscriptions, where licenses allow (to confirm).","who":"Market intelligence or research owns the library and checks traced sources; sales, marketing and strategy teams search it before new research and add what they find.","first":"Load six months of research from two teams. Trace the 30 most-quoted claims to their original sources, rewrite one recent summary with sources, and list questions both teams researched separately.","measure":"Share of summary claims traced to an original source; research questions answered from the library without starting over.","ask":"Where does market research live today, and how would someone on another team find and check it?","problems":[{"id":"m-07","card":"Finding the real source behind a market claim","statement":"Research gets repeated without a reliable way to check where the original claim came from.","how":"The agent follows each claim back through the articles quoting it to the original report or data, and records that chain so nobody has to trace it again.","ask":"Which market claim does your team repeat most, and do you know its original source?","roles":["Strategy & market intelligence"]},{"id":"m-14","card":"Market summaries leave out the supporting evidence","statement":"A research summary makes a claim without the source or context needed to judge whether it is useful.","how":"Every claim in a summary links to its source with the date, scope and method, so readers can judge whether it applies to their market and still holds.","ask":"When you read a research summary, what do you need to see before trusting a claim?","roles":["Strategy & market intelligence"]},{"id":"s2-22","card":"Every team repeats the same market research","statement":"Several teams look up the same market questions without sharing what they've already found.","how":"Every market question is checked against the library first, showing what other teams already found, when, and who to ask, before anyone starts again.","ask":"Which market question have different teams researched separately this year?","roles":["Strategy & market intelligence"]}]},{"id":"A52","name":"Weekly Market Brief","type":"Agent","wedge":"W4","what":"Drafts the weekly market brief from checked sources, puts the few updates most likely to change plans at the top, and ties each one to an account, message or decision, so the meeting starts with implications.","how":["Weekly, the agent gathers news on chosen companies and topics, drops repeats and checks each against a second source","It matches items to the team's plan list: target accounts, messages and open decisions","The brief leads with the few items that touch the plan, each with source, why it matters, and a proposed action and owner","The team marks each act, watch or ignore, and actions carry into next week's brief."],"data":"Public news, company announcements, filings and industry sources the team picks; a plan list of target accounts from the CRM, current messages and open decisions (to confirm).","who":"Market intelligence owns the brief and keeps the plan list current; strategy and sales leads review it weekly; named account owners or marketers act on agreed items.","first":"Run four weeks alongside the current brief for one team, with a plan list of 20 accounts and three open decisions. Compare prep time and how many items led to an action.","measure":"Hours to assemble each brief; share of brief items that led to an agreed action on an account, message or decision.","ask":"Who reads your market brief today, and what do they do differently after reading it?","problems":[{"id":"m-08","card":"Weekly market briefs take days to assemble","statement":"The team spends too long collecting and checking sources before it can discuss the implications.","how":"The agent gathers items, removes repeats and checks each against a second source before the meeting, so the team starts from a sourced draft and discusses implications.","ask":"Which part of building the brief takes longest: finding items, checking sources or writing it up?","roles":["Strategy & market intelligence"]},{"id":"m-10","card":"Researc ppear in long reports","statement":"A useful change is buried in a report that the relationship owner does not have time to read.","agent":"A48"},{"id":"m-10","card":"Research gets shared but never changes the plan","statement":"The team collects market insight without connecting it to an account, message or strategic decision.","agent":"A52"},{"id":"m-11","card":"Industry news isn't linked to the clients it affects","statement":"We spot a market change but do not identify which clients might need a conversation about it.","agent":"A48"},{"id":"m-12","card":"Warm introductions depend on someone's memory","statement":"We miss useful introductions because relationship connections are not easy to find or verify.","agent":"A50"},{"id":"m-13","card":"Client priorities changed. Our brief didn't.","statement":"We enter a client conversation using research that no longer reflects the client's situation.","agent":"A02"},{"id":"m-14","card":"Market summaries leave out the supporting evidence","statement":"A research summary makes a claim without the source or context needed to judge whether it is useful.","agent":"A51"},{"id":"s1-21","card":"Hearing about competitor launches from clients","statement":"A client asks about a competitor's new product or feature before our own team has heard about it.","agent":"A20"},{"id":"s1-22","card":"Our competitor notes are already out of date","statement":"The comparison sheet still describes an old version of the other product.","agent":"A20"},{"id":"s1-23","card":"Hard to check what the AI is doing","statement":"We can't easily see the steps an AI tool is taking or the actions it has already carried out.","agent":"A46"},{"id":"s1-24","card":"The AI demo works. The real workflow doesn't.","statement":"The demo handles a neat example but fails when real work brings exceptions and messy data.","agent":"A45"},{"id":"s2-21","card":"Competitor pricing changes catch us off guard","statement":"We find out a competitor changed its prices during a "card":"The AI demo works. The real workflow doesn't.","statement":"The demo handles a neat example but fails when real work brings exceptions and messy data.","agent":"A45"},{"id":"s1-25","card":"Why did our AI bill jump?","statement":"Usage costs change without a clear warning or explanation of what drove the increase.","agent":"A40"},{"id":"s2-23","card":"Our AI can see data it shouldn't","statement":"An AI tool can access customer or company information that the person using it isn't allowed to see.","agent":"A41"},{"id":"s2-24","card":"One person's AI tool. Nobody else can use it.","statement":"A teammate builds something useful, but sharing it with everyone else is difficult or impossible.","agent":"A47"},{"id":"s2-25","card":"Copying the same data from tool to tool","statement":"We manually paste information between systems because updates don't carry across automatically.","agent":"A36"},{"id":"s3-23","card":"One app update breaks the whole workflow","statement":"A small change in a connected tool stops an automated task that was working yesterday.","agent":"A37"},{"id":"s3-24","card":"Switching AI models means starting over","statement":"Moving to a different model provider means rebuilding workflows we already invested time in.","agent":"A43"},{"id":"s3-25","card":"AI answers without a source to check","statement":"The tool gives a confident answer but doesn't show where its facts came from.","agent":"A46"},{"id":"s4-23","card":"Our AI creates more work than it saves","statement":"Reviewing and correcting the tool's output takes longer than doing the task ourselves.","agent":"A45"},{"id":"s4-25","card":"Every simple automation needs an engineer","statement":"Even a small change to an everyday workflow has to wait for technical help.","agent":"A47"},{"id":"t-01","card":"Nobody knows who owns the broken automation","statement":"A workflow fails, but nobody knows who is responsible for fixing it.","agent":"A38"},{"id":"t-02","card":"The same workflow built in three tools","statement":"Different teams maintain separate automations for the same task.","agent":"A39"},{"id":"t-03","card":"AI tools bought before anyone checks access","statement":"A team buys an AI tool before checking which company data it needs to access.","agent":"A42"},{"id":"t-04","card":"No record of what the AI changed","statement":"We cannot trace which records an AI workflow edited or why it edited them.","agent":"A44"},{"id":"t-05","card":"Old employees still have access to our tools","statement":"People who left the company still have active accounts or permissions.","agent":"A41"},{"id":"t-06","card":"New AI tools. No plan to maintain them.","statement":"Teams launch AI workflows without assigning anyone to keep them working.","agent":"A38"},{"id":"t-07","card":"Hard to tell which tools are worth keeping","statement":"We pay for overlapping tools without a clear view of who uses them or what they save.","agent":"A39"},{"id":"t-08","card":"Failed automations disappear without an alert","statement":"A workflow stops running, but the team does not hear about the failure.","agent":"A37"},{"id":"t-09","card":"Two systems disagree on the same record","statement":"We have to investigate which system has the current information before we can act.","agent":"A35"},{"id":"t-10","card":"Testing AI changes takes too much manual work","statement":"Every change to an AI workflow needs repeated manual checks before we can trust it.","agent":"A45"},{"id":"t-11","card":"An AI retry creates duplicate records","statement":"Retrying a failed AI action adds a second record instead of safely finishing the first.","agent":"A44"},{"id":"t-12","card":"No easy way to stop a bad AI action","statement":"When an AI workflow starts making incorrect changes, stopping it takes too long.","agent":"A44"},{"id":"t-13","card":"Permissions are different in every tool","statement":"Keeping the right people and workflows connected requires separate access checks in each tool.","agent":"A41"},{"id":"t-14","card":"Sensitive data ends up in the wrong AI tool","statement":"People paste private company or customer information into tools that were not approved for it.","agent":"A42"},{"id":"t-15","card":"Every AI vendor needs another security review","statement":"Each new AI tool starts another round of questions about data, access and vendor controls.","agent":"A42"},{"id":"t-16","card":"No one checks whether the automation still works","statement":"A workflow keeps running after the business process changes, with no owner checking its output.","agent":"A38"},{"id":"t-17","card":"Hard to explain where an AI answer came from","statement":"We cannot trace an AI answer back to the source records it used.","agent":"A46"},{"id":"t-18","card":"An integration update breaks our field mappings","statement":"After a system update, information lands in the wrong fields or stops syncing.","agent":"A37"},{"id":"t-19","card":"The AI pilot has no clear measure of success","statement":"We launched a pilot without agreeing how to check whether it actually helps the team.","agent":"A45"}]}],"links":{},"custom":{"example-acme":{"for":"Acme Robotics (example)","title":"Agents we sketched after our chat","note":"This is an example of a private page. You'd write a short note here about what you discussed, then list the agents you designed for their team, plus any library agents you recommend.","agents":[{"id":"C1","name":"Trial-to-Paid Watch","type":"Agent","wedge":"W2","what":"Reviews every free-trial account each morning and tells the sales team which ones look ready for a conversation, with the evidence behind each pick.","how":["Each morning the agent reads trial sign-ups, product usage and the company behind each account (to confirm)","it matches personal-email sign-ups to companies and checks fit against your ideal customer profile","it ranks the trials showing buying signs, such as several teammates invited or key features used, and notes what's still unknown","the sales owner reviews the short list before anyone reaches out"],"data":"Trial sign-ups and product usage (to confirm); public company data for matching and fit.","who":"Growth or sales leadership owns it; account executives act on the list.","first":"Run it on last quarter's trials and compare its top picks with the trials that actually became customers.","measure":"Share of top-ranked trials that become paying customers; days from sign-up to first conversation.","ask":"What does a trial account do in its first week when it is going to buy?","problems":[],"link":""}],"library":["A05","A06"]}}};
