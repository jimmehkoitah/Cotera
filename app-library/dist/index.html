<style>
/* Mobile-first library: one column on phones, two-column agent pages on desktop. Cotera palette. */
:root {
  --paper: #f7f5f0; --surface: #ffffff; --ink: #1e2433; --muted: #5d6474; --blue: #385295;
  --soft: #e8ecf6; --line: #e6e2d9; --warm: #efe9dd; --good: #2f6b4f;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 18px; padding-block: 0 112px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand svg { height: 26px; width: auto; display: block; }
.brand-tag { font: 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-left: 12px; border-left: 1px solid var(--line); }
.eyebrow { font: 12px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 500 clamp(34px, 7vw, 54px)/1.04 var(--display); color: var(--blue); }
h2 { font: 500 26px/1.15 var(--display); }
h3 { font: 600 16px/1.35 var(--body); }
p { margin: 0; }
.muted { color: var(--muted); }
.stack { display: grid; gap: 14px; }
.section { display: grid; gap: 16px; padding-block: 26px; }
.hero { display: grid; gap: 16px; padding-block: 30px 8px; }
.hero p.lede { font-size: 18px; color: var(--muted); max-width: 54ch; }
.search { position: relative; }
.search input { width: 100%; font: 16px var(--body); padding: 15px 16px 15px 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.search input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.steps3 { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.steps3 div { background: var(--warm); border-radius: 12px; padding: 12px; font-size: 14px; }
.steps3 b { display: block; font: 12px/1.2 var(--mono); letter-spacing: .08em; color: var(--blue); margin-bottom: 4px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 8px; text-decoration: none; min-width: 0; }
a.card:hover { border-color: var(--blue); }
a.card:focus-visible, .btn:focus-visible, .chip-btn:focus-visible, .tab:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.card .count { font: 13px/1.3 var(--mono); color: var(--blue); }
.list { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; }
a.row:hover { border-color: var(--blue); }
.row .title { font-weight: 600; }
.row .sub { font-size: 14px; color: var(--muted); }
.row .arrow { color: var(--blue); font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px/1 var(--mono); letter-spacing: .04em; padding: 6px 9px; border-radius: 999px; background: var(--soft); color: var(--blue); }
.chip.plain { background: var(--warm); color: var(--ink); }
.chip.confirm { background: var(--warm); color: var(--muted); font-size: 11px; padding: 4px 7px; vertical-align: 1px; }
.back { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--blue); font-weight: 500; padding-block: 18px 4px; }
.agent { display: grid; gap: 22px; padding-block: 8px 20px; }
.agent-head { display: grid; gap: 12px; }
.agent-head .what { font-size: 18px; max-width: 62ch; }
.your-problem { background: var(--soft); border-radius: 16px; padding: 18px; display: grid; gap: 8px; }
.your-problem .q { font: 500 22px/1.2 var(--display); }
.your-problem .how { border-top: 1px solid rgba(56, 82, 149, .18); padding-top: 10px; }
.cols { display: grid; gap: 22px; }
@media (min-width: 860px) { .cols { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
.block { display: grid; gap: 10px; }
.block h3 { font: 12px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
ol.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
ol.flow li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; position: relative; }
ol.flow li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: var(--paper); font: 500 14px/30px var(--mono); text-align: center; }
ol.flow li:not(:last-child)::after { content: ""; position: absolute; left: 14.5px; top: 32px; bottom: 2px; width: 1px; background: var(--line); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 18px; }
.solves { display: grid; gap: 10px; }
.solves a { text-decoration: none; display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.solves a.current { border-color: var(--blue); background: var(--soft); }
.solves a:hover { border-color: var(--blue); }
.solves .t { font-weight: 600; }
.solves .h { font-size: 14px; color: var(--muted); }
.cta-bar { position: fixed; left: 0; right: 0; bottom: 64px; padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px) * 0); background: linear-gradient(to top, var(--paper) 70%, rgba(247, 245, 240, 0)); z-index: 5; }
.cta-inner { max-width: 1040px; margin: 0 auto; display: flex; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 14px 20px; font-weight: 600; text-decoration: none; border: 1px solid var(--blue); cursor: pointer; }
.btn.primary { background: var(--blue); color: var(--paper); flex: 1; }
.btn.ghost { background: var(--surface); color: var(--blue); }
.btn.small { padding: 10px 14px; font-size: 14px; }
.icon-btn { border: 1px solid var(--blue); background: var(--surface); color: var(--blue); border-radius: 999px; width: 50px; height: 50px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.icon-btn[aria-pressed="true"] { background: var(--blue); color: var(--paper); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 4px; padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 6; }
.tab { flex: 0 1 200px; display: grid; justify-items: center; gap: 2px; padding: 6px; border-radius: 10px; text-decoration: none; font-size: 12px; color: var(--muted); }
.tab[aria-current="page"] { color: var(--blue); background: var(--soft); }
.tab .n { font: 11px/1 var(--mono); background: var(--blue); color: var(--paper); border-radius: 999px; padding: 2px 6px; margin-left: 4px; }
.note { background: var(--warm); border-radius: 14px; padding: 14px 16px; font-size: 15px; display: grid; gap: 4px; }
.empty { text-align: left; display: grid; gap: 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 22px; }
.form { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.form label { display: grid; gap: 6px; font-weight: 500; font-size: 15px; }
.form input, .form textarea { font: 16px var(--body); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; }
.form input:focus, .form textarea:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
.proto { font: 12px/1.4 var(--mono); color: var(--muted); }
.made-for { background: var(--blue); color: var(--paper); border-radius: 18px; padding: 20px; display: grid; gap: 8px; }
.made-for h2 { color: var(--paper); }
.made-for .eyebrow { color: rgba(247, 245, 240, .75); }
.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 10; }
@media (max-width: 520px) { .steps3 { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .card, .row, .solves a { transition: border-color .15s; } }
</style>
</head>

<script>
window.LIB = {"agents":[{"id":"A01","name":"Contact Data Freshness","type":"Agent","wedge":"W1","what":"Checks contacts before anyone reaches out, finds missing or out-of-date emails, phone numbers, job titles and employers, and proposes corrections with a source for each, so reps reach the right people.","how":["A rep uploads a prospect list, or a weekly check runs on CRM contacts (to confirm)","The agent compares each person's title and employer with public profiles, company team pages and announcements, and checks that each email domain can receive mail","It marks every field confirmed, changed or unknown, with the source and date","An ops owner reviews the proposed corrections before anything is written back to the CRM."],"data":"Public profiles, company team pages, announcements and email domain records; CRM contacts, bounce history from the sending tool, and any data vendor or email checker already in use (to confirm).","who":"RevOps owns the checks and approves CRM updates; SDRs and AEs get corrected lists before outreach starts; CSMs hear when a client contact has moved.","first":"Check one rep's next 200 prospects plus last month's bounced emails, marking each field confirmed, changed or unknown, and compare the results with what the rep finds by hand.","measure":"Bounce rate on checked lists against unchecked ones; share of proposed corrections the ops owner approves unchanged.","ask":"When a contact detail turns out to be wrong, how do you usually find out?","problems":[{"id":"s1-02","card":"Need better contact data","statement":"Missing or wrong emails, phone numbers, and job titles make it hard to reach the right people.","how":"Each contact gets a field-by-field check of email, phone and title, with source and date, and anything it can't confirm is marked unknown so reps know what to verify.","ask":"Which is wrong or missing most often for you: emails, phone numbers or titles?","roles":["Sales & prospecting","Revenue & marketing ops"]},{"id":"s2-01","card":"Wrong job titles in the contact list","statement":"The list says someone has the role we need, but their actual job is different.","how":"It checks each listed title against the person's current public profile or company page and flags anyone whose actual job no longer matches the role you're targeting.","ask":"Which roles are you targeting, and how do you confirm someone holds one today?","roles":["Sales & prospecting"]},{"id":"s2-03","card":"Cold emails keep bouncing","statement":"The email addresses on our prospect list don't work, so messages never reach the intended people.","how":"Before outreach starts, it flags addresses whose domain can't receive mail, people who have left the company, and addresses that bounced before (bounce history to confirm).","ask":"Where does your prospect list come from, and how old is it by the time you send?","roles":["Sales & prospecting"]},{"id":"s3-01","card":"Contact changed jobs. CRM didn't.","statement":"Someone moves to another company, but their record still links them to their old employer.","how":"When a public profile or announcement shows a contact at a new employer, it proposes updating the record (to confirm) and alerts both the old and new account owners.","ask":"When a client contact changes jobs, who finds out first, and does the CRM get updated?","roles":["Sales & prospecting","Customer success & accounts","Revenue & marketing ops"]}]},{"id":"A02","name":"Account Research Brief","type":"Agent","wedge":"W1 / W2","what":"Builds a one-page brief on any account before a rep touches it, and refreshes it before each client conversation, so the research happens once, stays current, and lands where the team already works.","how":["Someone names an account, or a client meeting is booked (calendar to confirm)","The agent reads the company's site, news, job posts and public profiles, plus CRM history and notes (to confirm)","It writes a brief with ICP fit, likely buying roles, recent changes and a suggested angle, each line sourced and dated","Before each meeting it re-checks and leads with what changed, in the account record or Slack (to confirm)."],"data":"Public web, news, job posts and profiles; CRM account and activity history, past meeting notes and calendar (access to confirm).","who":"SDRs and AEs read it before outreach; account leads and partners read the refreshed version before client meetings; the sales manager spot-checks quality.","first":"Briefs for 25 accounts from one rep's list, compared side by side with that rep's own research, plus refreshed briefs for five upcoming client meetings, checked by whoever runs each meeting.","measure":"Research minutes per account before and after; share of briefs reps rate \"usable as is\"; client meetings where the brief missed a change the client raised.","ask":"Which three tabs do you open first, and what are you looking for in each?","problems":[{"id":"s1-04","card":"Too much tab switching for account research","statement":"Researching one company means jumping between its website, LinkedIn, the CRM, and other tools.","how":"It reads the website, public profiles, news and CRM history (to confirm) in one pass and puts the findings on one page, each line linked to its source.","ask":"How long does researching one account take today, and which step takes longest?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"m-13","card":"Client priorities changed. Our brief didn't.","statement":"We enter a client conversation using research that no longer reflects the client's situation.","how":"Before each client meeting it re-runs the research and leads with what changed since the last brief, such as new priorities or leaders, each point dated.","ask":"Before a client meeting, where does your research come from, and how old is it?","roles":["Strategy & market intelligence"]}]},{"id":"A03","name":"ICP Fit & Shared Target List","type":"Agent","wedge":"W1","what":"Turns your best customers into written fit criteria, finds and scores companies that match, fills in missing company facts, and builds one ranked target list that sales and marketing both work from, with the reason behind every score.","how":["Sales and marketing agree fit criteria, drafted from past wins and losses (to confirm)","The agent finds matching companies on the public web and fills in size, industry, location and other agreed fields","It scores each account, showing which criteria it met, missed or couldn't check, and proposes a priority tier and owner","Both teams review one shared list; approved fields go back to the CRM only after sign-off (to confirm)."],"data":"Past won and lost deals and CRM account fields (to confirm); public company websites, job posts, news and business registries for size, industry and location.","who":"RevOps owns the criteria and the list; sales and marketing leaders agree priority tiers together; SDRs and AEs work the accounts while campaigns target the same list.","first":"A read-only scored list of 200 accounts, half already in the CRM with blank fields and half newly found, reviewed in one session by a sales lead and a marketing lead.","measure":"Hours spent building lists before and after; share of listed accounts both teams accept; meeting rate on top-tier accounts compared with the rest.","ask":"Which current customers would you clone, and what do they have in common?","problems":[{"id":"s1-03","card":"Still guessing which accounts to target","statement":"There's no reliable way to tell which companies actually need what we sell.","how":"Each account is scored against criteria drawn from your actual wins and losses (to confirm), with the evidence for each point shown, so targeting rests on checkable reasons.","ask":"When a deal closed quickly, what was true about that company beforehand?","roles":["Sales & prospecting"]},{"id":"s2-06","card":"Building account lists by hand","statement":"Finding companies and collecting their details takes hours of manual research and spreadsheet work.","how":"It searches public sources for companies that match the agreed criteria and collects their details into a ready list, so people review results instead of filling spreadsheets.","ask":"What columns does your account spreadsheet have, and which take longest to fill?","roles":["Revenue & marketing ops"]},{"id":"s3-03","card":"Missing company details in the CRM","statement":"Basic facts like company size, industry, or location are blank when we need to qualify an account.","how":"It fills blank size, industry and location fields from public sources, shows where each value came from, and proposes CRM updates (to confirm) for an ops owner to approve.","ask":"Which blank CRM fields most often stop you from qualifying an account?","roles":["Revenue & marketing ops"]},{"id":"s4-01","card":"Sales and marketing disagree on priority accounts","statement":"The two teams focus on different companies, so campaigns and sales activity don't support each other.","how":"Sales and marketing set the scoring criteria together and both work from one ranked list, where every account shows why it scored as it did.","ask":"If you compared sales' and marketing's top 50 accounts today, how many would overlap?","roles":["Marketing & growth","Revenue & marketing ops"]}]},{"id":"A04","name":"Buying Group Mapper","type":"Agent","wedge":"W1 / W2","what":"Maps who is likely involved in a purchase at an account: the team that owns the problem, the people who shape the choice, and who can approve the spend, with the evidence and confidence for each.","how":["A rep names an account or an open deal","The agent reads public profiles, team pages, job posts and announcements, plus CRM contacts and call notes (to confirm)","It identifies the department that owns the problem you solve and lists likely users, evaluators and approvers, each marked confirmed, inferred or unknown","The rep reviews the map and chooses who to contact; nothing is added to the CRM without approval."],"data":"Public profiles, company team pages, job posts and leadership announcements; CRM contacts, call notes and who signed past deals (to confirm).","who":"AEs and SDRs use it on target accounts and open deals; sales managers use it in deal reviews; marketing uses the role list for campaigns aimed at those accounts.","first":"Maps for 15 open deals, checked by each deal owner, plus 10 closed deals to see whether it would have found the person who actually signed.","measure":"Share of mapped roles reps confirm as correct; deals where the approver was named before the proposal went out.","ask":"On your last won deal, who was involved that you didn't know about at the start?","problems":[{"id":"s1-06","card":"Missing contacts on the buying team","statement":"We know one person at the account, but we're missing others involved in choosing a product.","how":"Starting from the one contact you know, it finds their manager, peers and the other teams usually involved in choosing a product, each with its source.","ask":"How many people end up involved in a typical deal, and how many do you know early?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s2-04","card":"Right company. Wrong department.","statement":"A company could use our product, but we keep reaching a team that has no reason to buy it.","how":"It matches your product's use case to the department that owns that problem at each company, so outreach goes to the team with a reason to buy.","ask":"Which department do you keep reaching by mistake, and which one actually buys?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s3-02","card":"Can't find who signs off on the deal","statement":"We have interested people in the conversation, but don't know who has the authority to approve the purchase.","how":"It names the likely approver from the org structure, deal size and who signed similar past deals (to confirm), marked inferred until someone confirms it on a call.","ask":"On recent deals, who actually signed, and when did you first learn their name?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A05","name":"Buyer Readiness Signals","type":"Agent","wedge":"W2","what":"Combines intent data, website visits and public buying signals into one short, dated note per account that explains what triggered it, then recommends a play that fits how ready the account looks, so reps see only the few worth acting on now.","how":["Daily, the agent collects intent alerts, website visits and CRM activity (to confirm), plus public signals like hiring, funding and leadership changes","It groups them by account and checks them against each other and the account's fit","It writes one note per account: what happened, when, what it may mean and what's still unknown","Each rep gets a short ranked list with a suggested play: call, send something useful, or wait."],"data":"Intent data feeds, website visit data, marketing engagement and CRM activity (all to confirm); public job posts, news, funding announcements and leadership changes.","who":"Marketing ops or RevOps owns the signal rules; SDRs and AEs work the ranked list; marketing handles accounts not yet ready; sales leaders check which signals led to meetings.","first":"Run it on last quarter's intent alerts and website visits to see which accounts it would have ranked highest, and compare them with the accounts that actually opened a deal.","measure":"Share of recommended calls that become real buying conversations; account alerts each rep receives per week, before and after.","ask":"Thinking of your last good deal, what was the first sign they were ready, and who saw it?","problems":[{"id":"s1-08","card":"Intent isn't intenting","statement":"The data says an account is interested, but that interest doesn't turn into a real buying conversation.","how":"It treats an intent score as one clue, recommends a call only when fit and a second sign agree, and tracks which combinations of signs actually led to conversations.","ask":"Of the accounts your intent data flagged last quarter, how many became real conversations?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s2-08","card":"Intent alerts with no clue what triggered them","statement":"We get an alert that an account is interested without enough detail to understand why.","how":"Each note spells out the trigger: topics researched, pages viewed, dates and any matching public news, and says plainly when the intent vendor gives no detail.","ask":"When an intent alert arrives, what detail would you need to decide what to do?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s2-09","card":"Our outreach arrives after the buying decision","statement":"We contact an account only to learn they've already chosen another product.","how":"It flags early signs a search is starting, like a new leader in the buying team, related job posts or their current tool's contract nearing renewal (to confirm).","ask":"On deals lost to an earlier decision, what happened at the account before they chose?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s3-08","card":"Sales alerts nobody has time to read","statement":"So many account updates arrive that the team starts ignoring the useful ones too.","how":"All updates about an account are merged into one note, and each rep gets only a short ranked list, with lower-priority signals held for a weekly digest.","ask":"How many account alerts does a rep get each week, and how many get opened?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s3-09","card":"A website visit doesn't mean 'call me'","statement":"Browsing a page gets treated as a request for a sales call, even when the visitor isn't ready.","how":"It weighs which pages were viewed and how often (to confirm), and suggests a call only when visits match other readiness signs, otherwise suggesting something useful to send.","ask":"Which website visits trigger a sales call today, and how often do those calls go anywhere?","roles":["Marketing & growth"]}]},{"id":"A06","name":"Inbound Lead Response","type":"Workflow","wedge":"W1","what":"Gives every inbound lead a fast first reply that fits how they found you: it researches the person, labels the source and request, and drafts a matching response for a rep to approve while the request is still fresh.","how":["A demo request, form fill, referral or ad response arrives (sources to confirm)","The workflow checks the person and company against public sources and the CRM (to confirm), and labels the source and request","It drafts a reply to match: a booking link for demo requests, a note naming the referrer for referrals, a useful resource for ad responses","The rep approves or edits it, and leads still waiting are flagged."],"data":"Form submissions, demo requests, referral notes and ad campaign details, plus CRM records (all to confirm); public company and profile information.","who":"Marketing ops owns the source rules and reply templates; SDRs or AEs approve and send; the sales manager watches response times.","first":"Two weeks on demo requests and referrals only, with every draft approved by a rep and the time to first reply logged for each lead.","measure":"Time from inbound request to first reply, before and after; meeting rate by lead source.","ask":"When someone fills in your demo form, what happens next, and how long does it take?","problems":[{"id":"s1-09","card":"Gotta be quicker with inbound leads","statement":"People ask about our product, but we take too long to get back to them.","how":"Research and a draft reply are ready when the request arrives, so the rep only reviews and sends, and leads left waiting past an agreed time are flagged.","ask":"How long does a new inbound request usually wait before someone replies, and why?","roles":["Sales & prospecting"]},{"id":"s3-12","card":"Different lead sources. Same follow-up.","statement":"A referral, an ad response, and a demo request all get the same message despite different expectations.","how":"It labels each lead's source and request, then drafts to match: a booking link for a demo request, a note naming the referrer, a useful resource for an ad click.","ask":"What should a referral hear from you that someone who clicked an ad shouldn't?","roles":["Marketing & growth"]}]},{"id":"A07","name":"Lead Intake & Routing Checker","type":"Workflow","wedge":"W1","what":"Checks every new lead before it reaches a rep: matches it to the right account and owner, tests the assignment against your territory rules written in plain English, and flags wrong or double ownership with the reason.","how":["New leads arrive from forms, events or spreadsheet uploads (sources to confirm)","The workflow checks required fields, matches each lead to an existing account and owner, and fills gaps from public company data","It compares the assigned rep with the plain-English territory rules and flags mismatches and accounts with two owners","An ops owner reviews the flags; routing changes go live only after approval."],"data":"Lead forms and import files, CRM accounts, owners and assignment history, current routing rules and territory list (all to confirm); public company data for region and size.","who":"RevOps owns the rules and reviews flags; sales managers settle ownership conflicts; reps see why each lead came to them.","first":"Run last month's leads through it read-only: rewrite the current rules in plain English, then list every lead that would have gone to a different rep and every account with two owners.","measure":"Share of leads reassigned after first routing; time from lead arrival to rep assignment; number of accounts with more than one owner.","ask":"When a lead goes to the wrong rep, how do you find out, and who fixes it?","problems":[{"id":"s1-05","card":"New leads keep landing with the wrong rep","statement":"Incoming leads get assigned to people who don't cover that company, region, or type of customer.","how":"Before assignment, it checks each lead's company, region and customer type against every rep's territory and flags any lead headed to someone who doesn't cover it.","ask":"Which part of your territory split causes most misroutes: region, company size or customer type?","roles":["Revenue & marketing ops"]},{"id":"s2-02","card":"The same account assigned to two reps","statement":"Two reps are responsible for the same account, and neither knows who should take the lead.","how":"It lists every account with more than one active owner, shows each rep's recent activity there, and proposes one owner for a sales manager to confirm.","ask":"When two reps claim the same account, who decides, and how long does it take?","roles":["Revenue & marketing ops"]},{"id":"s3-05","card":"Lead routing rules nobody understands","statement":"Nobody can explain or confidently change the rules that decide which rep receives each lead.","how":"It rewrites the current routing rules in plain English, attaches a reason to every assignment, and tests any proposed rule change against recent leads before it goes live.","ask":"Who last changed your routing rules, and could anyone else explain them today?","roles":["Revenue & marketing ops"]},{"id":"s3-06","card":"New leads wait on spreadsheet imports","statement":"Fresh leads can't reach the sales team until someone uploads and checks another spreadsheet.","how":"It picks up lead files from a shared folder as they land (to confirm), checks and matches each row, and sets aside only problem rows for review.","ask":"Which leads still arrive by spreadsheet, and how long do they sit before upload?","roles":["Revenue & marketing ops"]}]},{"id":"A08","name":"Explainable Lead Score","type":"Agent + dataset","wedge":"W1","what":"Gives every lead score a plain-English reason: which facts raised or lowered it, where each fact came from and what's still unknown, and keeps a dataset showing which scores turned into real opportunities.","how":["A new lead arrives with its current score (to confirm)","The agent scores it against criteria written in plain English, like company fit, role and recent activity, and lists what raised or lowered it, each with its source","It notes missing data and where its view differs from the current score","The dataset records each score, its reasons and the outcome, and RevOps reviews monthly which reasons predicted real deals."],"data":"Lead and contact fields, the current scoring model and its inputs, marketing engagement and CRM outcomes (all to confirm); public company and role data.","who":"RevOps owns the criteria and dataset; SDRs read the reasons before working a lead; sales and marketing leaders approve any change to the criteria.","first":"Score last quarter's leads both ways, with reasons shown for each, and compare which ranking better matched the leads that became opportunities, before scoring any live leads.","measure":"Opportunity rate of top-ranked leads compared with the current score; share of score reasons reps rate as accurate.","ask":"Pick your top-scored lead this week: can anyone say why it ranks above the next one?","problems":[{"id":"s1-07","card":"A lead score nobody can explain","statement":"Leads get ranked, but nobody can tell us what makes one worth pursuing over another.","how":"Every score lists its reasons in plain English, like company fit, the contact's role and recent pricing-page visits (to confirm), so reps see why one lead outranks another.","ask":"Who built your current lead score, and when was it last checked against closed deals?","roles":["Revenue & marketing ops"]}]},{"id":"A09","name":"Campaign Audience Guard","type":"Workflow","wedge":"W1","what":"Checks every outreach list and automated follow-up against declines, opt-outs and current customers before messages go out, and flags anyone who shouldn't be contacted, with the reason, for a person to review.","how":["A list is imported or an automated follow-up is due to send (tools to confirm)","The workflow checks each person against opt-outs from every tool and current customer accounts","It reads recent replies for clear no's, like 'not interested' or 'please stop', even when nobody marked them","It lists flagged people with the reason; an ops owner reviews, and automatic holds start only once the checks prove accurate."],"data":"Outreach and email tool lists, sequences and replies; unsubscribe and do-not-contact lists; CRM customer accounts and contacts; import files (all to confirm).","who":"RevOps or marketing ops owns the checks; reps and marketers see why each person was flagged; CS confirms customer matches.","first":"A read-only check of all running email sequences and the last three list imports, listing everyone who declined, opted out or already buys from you, with a sample checked by hand.","measure":"People flagged before a message went out; opt-out complaints and already-a-customer replies per month, before and after.","ask":"When someone says no or opts out in one tool, how does every other tool find out?","problems":[{"id":"s2-13","card":"Still emailing people who already said no","statement":"Automated follow-ups keep going after a person has clearly declined.","how":"It reads replies in active sequences (to confirm), spots clear declines like 'not interested' or 'please stop' that nobody marked, and flags those people before the next follow-up.","ask":"When a prospect replies no, who stops the sequence, and how quickly does it happen?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s4-04","card":"Existing clients treated like brand-new leads","statement":"Current customers enter prospect campaigns because our systems don't recognize that they already buy from us.","how":"It matches every campaign contact against current customer accounts (to confirm) by company domain and name, including client subsidiaries, and flags matches for the account owner before launch.","ask":"How does your marketing team know which companies already buy from you?","roles":["Customer success & accounts","Revenue & marketing ops"]},{"id":"s4-08","card":"Unsubscribed contacts back in the campaign","statement":"Someone opts out, but an import or another tool adds them to a new outreach list.","how":"Every new import or list is checked against opt-outs recorded in all your tools (to confirm) before it goes live, so an unsubscribe anywhere is caught.","ask":"Where is your master opt-out list kept, and which tools check it before sending?","roles":["Revenue & marketing ops"]}]},{"id":"A10","name":"Personalized Outreach Writer","type":"Agent","wedge":"W2","what":"Drafts a short first email for each prospect around one specific, sourced reason to talk now, written in your team's own voice, for a rep to edit and send.","how":["A rep picks a prospect, or one arrives from a target list","The agent reads recent company news, job posts, the person's public posts and role, plus CRM history (to confirm), and picks the most timely reason to reach out","It drafts a short email in the style of your best past emails, citing its source","The rep edits and sends; if no good reason exists, the agent says so."],"data":"Public news, job posts, company pages and profiles; your best-performing past emails, messaging guide and CRM history (to confirm).","who":"SDRs and AEs edit and send drafts; marketing owns the voice guide and approved claims; sales managers review a sample of drafts each week.","first":"Drafts for 30 prospects on one rep's list, mixed in with that rep's own emails, so the team can judge relevance and try to spot which ones a tool wrote.","measure":"Minutes to produce a send-ready email; reply rate against the rep's usual emails; share of drafts sent with light edits.","ask":"What did your best-performing cold email say, and why do you think it worked?","problems":[{"id":"s1-12","card":"Sales emails that could be for anyone","statement":"Adding a first name doesn't make the rest of the email relevant to that person's business.","how":"Each email is built around one fact about the prospect's business, such as a new market or a hiring push, and links it to how you help.","ask":"Beyond the first name, what does a rep usually change in an email for each prospect?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s2-12","card":"Writing one good sales email takes forever","statement":"Turning research into a message that matters to one prospect takes more time than we have.","how":"The agent does the research and writes the first draft, so the rep's time goes on checking the reason and adjusting the tone.","ask":"How long does one properly researched email take today, from start to send?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s3-11","card":"AI emails that sound like AI emails","statement":"The wording is so generic or unnatural that the recipient can tell a tool wrote it.","how":"Drafts follow the style of your team's best past emails and a list of banned phrases, stay short and plain, and a rep edits each one before it goes out.","ask":"Which phrases make you think an email was written by a tool?","roles":["Marketing & growth"]},{"id":"s4-11","card":"Good prospect. Nothing relevant to say.","statement":"We know the company is a fit but can't find a timely, useful reason to start a conversation.","how":"It searches news, job posts, leadership changes and earnings for a timely trigger linked to your product, and when it finds none, it says so instead of inventing one.","ask":"When a good-fit account has no recent news, what reason to reach out has worked?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A11","name":"Cold Call Prep","type":"Agent","wedge":"W1 / W2","what":"Prepares a short call sheet for each prospect in a call block: who they are, why the call is timely, an opener, likely objections with answers, and which number to try, so reps pick up the phone ready.","how":["A rep schedules a call block","The agent picks best-fit prospects with a recent, sourced reason to call, warmest first, and checks which numbers look current (to confirm)","For each it writes a one-page call sheet: why now, an opener, two questions and answers to likely objections","After each call, the rep's quick notes become a draft follow-up and CRM update to approve (to confirm)."],"data":"Public news, job posts and profiles; the rep's prospect list, CRM history, phone numbers and past call outcomes (to confirm).","who":"SDRs and AEs use the call sheets; the sales manager schedules call blocks and reviews sheet quality; RevOps confirms where call outcomes are logged.","first":"Call sheets for one rep's next 20 calls in a single call block, with the rep noting which sheets helped and which openers started a real conversation.","measure":"Calls made per scheduled block before and after; share of calls that become real conversations.","ask":"What would a rep need to know before they'd feel ready to pick up the phone?","problems":[{"id":"s1-10","card":"Nobody wants to cold call","statement":"Calling someone who hasn't asked to hear from us is the task everyone keeps putting off.","how":"Each call in a scheduled block comes with a sourced reason the prospect might care now, an opener and objection answers, warmest prospects first.","ask":"When a rep skips a call block, what's the usual reason?","roles":["Sales & prospecting"]}]},{"id":"A12","name":"Same-Day Event Follow-up","type":"Workflow","wedge":"W2","what":"Turns a badge scan or booth note into a personal follow-up draft within hours, while the conversation is still remembered.","how":["At the end of each event day, the attendee list or booth notes arrive","Each person is matched to their company and to any existing CRM record (to confirm)","The workflow drafts a follow-up that references what was actually discussed, plus one relevant resource","A rep approves or edits it before anything is sent."],"data":"Event attendee export, booth or scanner notes and CRM records (all to confirm); public company context.","who":"Field or event marketing owns it; reps approve and send.","first":"Run it on one event's list, with every draft human-approved.","measure":"Hours from event to first touch; reply rate against the last comparable event.","ask":"How long after an event does the first email usually go out, and who writes it?","problems":[{"id":"s1-11","card":"Event leads go cold before we follow up","statement":"By the time we email someone we met at an event, the conversation is no longer fresh.","how":"Reps get same-day drafts that mention what was discussed at the booth, so writing no longer delays the first email and the person still remembers the conversation.","ask":"What do reps write down after a booth conversation, and where do those notes end up?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A13","name":"Meeting & Demo Follow-through","type":"Workflow","wedge":"W2","what":"Follows each demo from booking to agreed next step: it drafts reminders tied to what the buyer asked to see, checks whether a next step was agreed, and flags no-shows and buyers who go quiet.","how":["A demo is booked","The workflow drafts a reminder naming what the buyer asked to see, and flags bookings the buyer hasn't confirmed","After the call, it reads notes or the transcript (to confirm) and records the agreed next step, open questions and who else should join","After a no-show, a missing next step or a quiet week, the rep gets a drafted reschedule note or recap to edit and send."],"data":"Calendar bookings and booking-form answers, call notes or transcripts, email reply status and CRM opportunity records (all to confirm); public company context.","who":"Sales or marketing ops owns it; AEs and SDRs edit and send every draft; the sales manager reviews demos left without a next step.","first":"The next 30 demos booked by one team, with every reminder and recap approved by the rep, plus a daily list of demos that ended without a next step.","measure":"Show rate for booked demos, before and after; share of completed demos that end with a dated next step.","ask":"What happens between a demo being booked and the buyer's next reply, and who owns each step?","problems":[{"id":"s1-13","card":"Great demo. Then we get ghosted.","statement":"The demo seems to go well, but the buyer stops replying and there's no agreed next step.","how":"After each demo it checks the notes for an agreed, dated next step; if none exists or the buyer goes quiet, the rep gets a recap draft proposing one.","ask":"In your last ghosted deal, what had the buyer agreed to do next?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s2-10","card":"Booked demos. Empty meeting rooms.","statement":"People book time to see the product, then don't show up for the call.","how":"Each booking gets a reminder draft naming what the buyer asked to see; unconfirmed bookings are flagged for a personal check, and no-shows get a same-day reschedule draft.","ask":"How far ahead do people book demos, and what reminder do they get before the call?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A14","name":"Lead Revival","type":"Agent","wedge":"W2","what":"Goes back through old leads and lost conversations, finds the ones where the reason they weren't ready may have changed, and gives the rep a dated reason to reopen, with the old conversation summarized.","how":["Monthly, the agent reads lost and stalled leads, their emails, notes and loss reasons (to confirm)","It records why each wasn't ready and any date they gave to revisit","It checks public sources for changes since, such as a new leader, funding or hiring","It ranks the few worth reopening now, with dated evidence, what's still unknown and an opener that picks up the old conversation","Reps choose which to reopen."],"data":"CRM lead and opportunity history, loss reasons, past emails and call notes (to confirm); public news, job posts, funding announcements and profiles.","who":"Sales ops or the SDR manager owns it; SDRs and AEs choose which leads to reopen; the sales manager reviews whether revived leads were worth the time.","first":"A one-time review of last year's lost leads for one team: the 25 most promising, each with the old reason and new evidence, checked by the reps who owned them.","measure":"Reply and meeting rate on reopened leads compared with new cold leads; pipeline created from leads that had been closed or stalled.","ask":"When a lead says not now, where is the reason recorded, and does anyone look at it again?","problems":[{"id":"s2-07","card":"Old leads never get a second look","statement":"Someone who wasn't ready before may be ready now, but we never revisit the old conversation.","how":"It reads each old conversation for the stated reason and timing, such as budget next year, and flags the lead when that reason looks resolved or the date arrives.","ask":"What are the usual reasons a lead isn't ready, and how would you know they've changed?","roles":["Sales & prospecting"]}]},{"id":"A15","name":"Hot Reply & Intro Router","type":"Workflow","wedge":"W1 / W2","what":"Spots interested replies, warm introduction offers and conversations waiting on an absent rep, then proposes who should act on each one and by when, so no hot conversation sits without an owner.","how":["A message arrives in the shared inbox or a chosen chat channel (to confirm)","It is labeled: interested reply, introduction offer, question, not interested or auto-reply","The workflow proposes an owner from account ownership, or a backup if calendars or out-of-office notes show the owner is away (to confirm)","The owner gets a deadline and reminders until someone answers; a manager approves any reassignment, with no automatic rerouting in version one."],"data":"Shared inbox and outreach tool replies, chosen team chat channels, CRM account ownership, rep calendars and out-of-office status (all to confirm).","who":"Sales or marketing ops owns the rules; SDRs and AEs answer what is assigned to them; the sales manager confirms backups and reviews anything still unanswered.","first":"Two weeks of one team's shared inbox and one busy chat channel, producing a daily list of hot replies and intro offers with suggested owners that the manager assigns by hand.","measure":"Hours from an interested reply or intro offer to the first response; number of hot items still unanswered past their deadline.","ask":"When a prospect says yes or a colleague offers an intro, who should act, and how would you know they did?","problems":[{"id":"s2-11","card":"Interested replies stuck in a shared inbox","statement":"Positive replies arrive, but nobody takes responsibility for answering them.","how":"Each positive reply in the shared inbox is flagged with a proposed owner from account ownership and a deadline, and reminders continue until someone answers it.","ask":"Who checks the shared inbox today, and how long does a positive reply usually wait?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s4-09","card":"Warm introductions get buried in chat","statement":"A teammate offers an introduction to a prospect, but the message is forgotten before anyone acts.","how":"It catches intro offers in chosen chat channels, names a rep and a deadline, and drafts a short note the teammate can forward to make the introduction.","ask":"Where do teammates usually offer introductions, and what happens to that message next?","roles":["Sales & prospecting","Marketing & growth"]},{"id":"s4-10","card":"Lead follow-up stops when the rep is away","statement":"There's no backup for an absent rep, so active prospects wait until that person returns.","how":"When calendars or out-of-office notes show a rep is away, it lists their active prospects and new replies for a backup the manager confirms, each with a status summary.","ask":"When a rep is out, who covers their prospects today, and how is that decided?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A16","name":"Deliverability Watch","type":"Workflow","wedge":"W1 (operations)","what":"Checks every sending domain and mailbox on a schedule, finds the likely reasons sales emails land in spam, and gives the owner a ranked list of fixes with the evidence behind each one.","how":["Daily, the workflow checks each sending domain's authentication records (SPF, DKIM, DMARC) and public blocklists","It reads sending volume, bounces and complaints from the email tools and scans live templates for tracking links and images (to confirm)","It compares mailboxes to spot sudden reply drops","It sends the ops owner a ranked fix list, each item marked confirmed or suspected; pausing a mailbox or campaign stays a human decision."],"data":"Public DNS records and blocklists; sending volume, bounce, complaint and reply data, plus live email templates (to confirm); inbox placement test results if the team runs them (to confirm).","who":"Marketing or sales ops owns it and reviews the fix list; whoever manages the domains fixes records; SDR managers adjust volume and templates.","first":"A one-time health report on every sending domain and mailbox, with each problem marked confirmed or suspected, reviewed with whoever manages the email settings.","measure":"Share of test emails reaching the inbox, before and after fixes; reply rate per mailbox over the same period.","ask":"Who set up your sending domains, and when did anyone last check how they're configured?","problems":[{"id":"s3-10","card":"Our sales emails land in spam","statement":"Messages go to junk folders instead of the inbox, even when the email address is correct.","how":"Because the addresses are fine, it checks the sender side: authentication, blocklists, volume and template content, and names the domain or mailbox whose mail lands in junk.","ask":"Did the spam problem start suddenly, for example after a new domain, tool or campaign?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A17","name":"Outreach Effectiveness Dataset","type":"Dataset","wedge":"W2","what":"Links every email, call and message to what happened next, such as a reply, a meeting held or a deal created, so the team can see which outreach leads to useful conversations.","how":["Weekly, outreach activity is pulled from the email, calling and CRM tools (to confirm)","Each touch is linked to any reply, meeting or opportunity that followed","Replies are labeled interested, objection, referral, not now or auto-reply","Results are grouped by message, sequence step, call script, audience and rep, with opens marked as a weak signal","Sales and marketing review it monthly against an agreed definition of a useful conversation."],"data":"Email sequence activity and reply text, call logs and outcomes, meeting records, CRM opportunities and stages (all to confirm).","who":"Marketing or revenue ops owns the dataset; sales and marketing leaders review it monthly; SDR managers and campaign owners change messages based on it.","first":"One quarter of one team's outreach, linked to replies and meetings, with a hand-checked sample of reply labels and a short list of the best and worst messages.","measure":"Useful conversations per hundred touches, by message and channel; share of reply labels that reviewers agree with.","ask":"What would have to happen after an email or call for you to count it as a useful conversation?","problems":[{"id":"s3-13","card":"Nobody knows which outreach actually works","statement":"We can't tell which messages or calls led to useful conversations rather than just activity.","how":"Each message and call is traced to the replies, meetings and opportunities that followed, so teams can rank templates and call scripts by the useful conversations they started.","ask":"Which email or call script do you think works best, and what makes you think so?","roles":["Marketing & growth"]},{"id":"s4-13","card":"High open rates. No actual conversations.","statement":"Outreach looks successful in the email dashboard but doesn't lead to replies or useful discussions.","how":"It puts replies and meetings per message beside open rates and flags templates with high opens but few replies, since privacy features and security scanners can inflate opens.","ask":"Which number from the email dashboard gets reported to leadership, and has anyone checked it against replies?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A18","name":"Call Notes to CRM","type":"Workflow","wedge":"W2","what":"Turns each sales call into a short CRM note covering who attended, what was discussed, what was agreed and what is still open, so the next person can pick up where the call ended.","how":["A call ends","The workflow reads the transcript or the rep's quick voice note (to confirm)","It drafts a note: attendees, problems raised, what was agreed, next steps with owners and dates, and open questions","The rep checks and approves it before it is saved to the CRM (write-back to confirm)","A daily list flags calendar calls that still have no note."],"data":"Call recordings or transcripts, rep voice or text notes, calendar meetings with external attendees, and CRM contact and opportunity records (all to confirm).","who":"Revenue ops owns the note format; reps approve each note; managers, CSMs and marketers read the notes when they next work the account.","first":"Drafted notes for one team's calls over two weeks, kept outside the CRM, compared with what reps would have written and checked for anything wrong or missing.","measure":"Share of external calls with an approved note by the next day; share of drafts approved with no or light edits.","ask":"After a sales call, what does the next person need to know, and where do they look for it today?","problems":[{"id":"s4-12","card":"Sales calls end with no notes in the CRM","statement":"The conversation happened, but there's no record of what was discussed or agreed for the next person to use.","how":"The rep gets a draft note of what was discussed and agreed, with owners and dates, to approve after the call; calls still missing a note are flagged daily.","ask":"Why do notes get skipped today: no time, no habit, or nobody reads them?","roles":["Sales & prospecting","Marketing & growth","Revenue & marketing ops"]}]},{"id":"A19","name":"Account History Brief","type":"Agent","wedge":"W3 / W2","what":"Builds one sourced history for each client from the CRM, call notes, support tickets and chat, so anyone covering, inheriting or contacting the account can see what was discussed, promised and already reported.","how":["On request, when an owner changes, or weekly","The agent reads CRM records, call notes, emails, support tickets and chosen chat channels (to confirm)","It writes a brief: dated timeline, open issues in the client's words, commitments with owners, key contacts and what's still unknown, each line linked to its source","The brief goes to the account record or the requester (to confirm), and the owner adds or corrects context monthly."],"data":"CRM account, contact and activity history, call notes and transcripts, support tickets, email and chosen chat channels (all to confirm).","who":"CS or revenue ops owns it; account owners check their briefs monthly; support, sales, CS and new owners read them before contacting the client.","first":"Briefs for 20 accounts that recently changed hands or had open support issues, checked for accuracy and gaps by the people who know each account best.","measure":"Time for a new owner or covering teammate to prepare for a first client call; share of brief lines owners mark as correct.","ask":"When you pick up an account you don't know, which systems do you check, and what is usually missing?","problems":[{"id":"s1-20","card":"Client notes are spread across too many systems","statement":"Understanding one client's history means searching the CRM, call notes, support tools, and chat.","how":"The agent searches the CRM, call notes, support tools and chat in one pass and merges what it finds into one dated timeline, each line linked to its source.","ask":"Which system holds the client detail people most often can't find when they need it?","roles":["Customer success & accounts","Revenue & marketing ops"]},{"id":"s2-19","card":"Client history lives in one person's head","statement":"If the account owner is unavailable, the rest of the team can't pick up where they left off.","how":"The brief captures the owner's notes and emails, and a monthly prompt asks them to add context only they know, so a teammate can pick up without them.","ask":"When an account owner was last out, what did the team need from them and couldn't find?","roles":["Customer success & accounts"]},{"id":"s2-20","card":"Clients repeat the same problem to every team","statement":"Support, sales, and customer success each ask the client to explain an issue they've already described.","how":"Open issues are listed in the client's words with the date and team they told, so support, sales or CS can refer to the issue instead of asking again.","ask":"Which issues do clients most often have to explain twice, and to which teams?","roles":["Customer success & accounts"]},{"id":"s4-07","card":"New reps inherit account lists with no context","statement":"A rep takes over accounts without knowing what's been tried, discussed, or agreed with them.","how":"On an ownership change, the new rep gets a handover brief per account covering what was tried, discussed and agreed, plus open questions for the previous owner.","ask":"When accounts are reassigned, what handover happens today, and what do new reps wish they'd known?","roles":["Sales & prospecting","Marketing & growth"]}]},{"id":"A20","name":"Competitor Watch","type":"Agent","wedge":"W4","what":"Watches named competitors' public pages for launches, pricing changes and product updates, keeps the comparison sheet dated and sourced, and checks claims reps hear against public evidence, so the team learns of changes before clients mention them.","how":["Daily, the agent checks competitors' product, pricing, release-note and news pages","It compares them with the last saved copy and confirms changes with a second source where possible","It writes a note on what changed, with evidence and what it may mean, for reps facing that competitor (to confirm)","It proposes dated edits to the comparison sheet for an owner to approve; reps can also submit claims to check."],"data":"Competitor websites, pricing pages, release notes, press, review sites and job posts; CRM deal records naming competitors (to confirm); the current comparison sheet (to confirm).","who":"Product marketing or market intelligence owns it and approves sheet edits; sales leaders review alerts; reps use the sheet and submit claims to check.","first":"Three competitors watched for a month: a weekly digest of verified changes, a comparison sheet with a date and source on each line, and answers to claims reps submit.","measure":"Competitor changes the team knew about before a client or prospect raised them; share of comparison sheet lines with a recent dated source.","ask":"Which competitor shows up most in your deals, and how did you last learn something new about them?","problems":[{"id":"s1-21","card":"Hearing about competitor launches from clients","statement":"A client asks about a competitor's new product or feature before our own team has heard about it.","how":"Launches found in release notes, product pages or press go out as a same-day note to the reps and account managers most likely to be asked about them.","ask":"How did you hear about the last competitor launch, and how long after it happened?","roles":["Strategy & market intelligence"]},{"id":"s1-22","card":"Our competitor notes are already out of date","statement":"The comparison sheet still describes an old version of the other product.","how":"Each line of the comparison sheet carries a source and date; when a competitor page changes, the agent proposes the edit, and lines past their review date are flagged.","ask":"Who owns the comparison sheet today, and when was it last updated?","roles":["Sales & prospecting","Marketing & growth","Strategy & market intelligence"]},{"id":"s2-21","card":"Competitor pricing changes catch us off guard","statement":"We find out a competitor changed its prices during a sales conversation we weren't prepared for.","how":"It saves each competitor pricing page on a schedule and sends sales a before-and-after view when prices, plans or limits change; pricing heard in deals is logged as unverified.","ask":"Is your competitors' pricing public, or do you mostly learn it from buyers?","roles":["Strategy & market intelligence"]},{"id":"s4-22","card":"Competitor claims we can't verify","statement":"We hear claims about another product but can't find reliable evidence to check them.","how":"A rep submits a claim they heard; the agent searches docs, release notes and reviews, and answers supported, contradicted or no evidence found, with links and what's still unknown.","ask":"What competitor claim did you hear recently that you couldn't confirm or disprove?","roles":["Sales & prospecting","Marketing & growth","Strategy & market intelligence"]}]},{"id":"A21","name":"Win-Loss Pattern Finder","type":"Agent","wedge":"W4 / W2","what":"Reads won and lost deals to find the objections behind repeated losses to the same competitor, shows the evidence, and turns each pattern into a proposed pitch or plan change with a named owner.","how":["Monthly, the agent reads won and lost deals: loss reasons, call transcripts, emails and notes (to confirm)","It notes each objection, with quotes, and which competitor won","It groups repeat objections and compares each with won deals that overcame it","It reports the pattern, deals affected, evidence, what's still unknown and a proposed change","A named owner accepts or rejects it, and the next report checks whether losses changed."],"data":"Closed-won and closed-lost CRM deals, loss reasons, call transcripts, email threads and win-loss interview notes (all to confirm); competitors' public pages for context.","who":"Product marketing or strategy owns it; sales leadership and product review each report; enablement, marketing and product owners make the changes they accept.","first":"The last two quarters of deals lost to one main competitor, read against won deals, producing the top three repeat objections with quotes for sales leaders to check.","measure":"Deals lost to the same objection, quarter over quarter; share of proposed changes that owners accept and put into the pitch or plan.","ask":"How do you decide today why a deal was lost, and who sees that reason afterwards?","problems":[{"id":"s4-21","card":"Losing to competitors for the same reason","statement":"The same objection keeps costing us deals, but the lesson never changes our pitch or plan.","how":"It finds the objection behind repeat losses, shows how won deals answered it, and gives a named owner a pitch or plan change to accept or reject.","ask":"Which objection keeps coming up in losses to the same competitor, and has anything changed because of it?","roles":["Sales & prospecting","Marketing & growth","Strategy & market intelligence"]}]},{"id":"A22","name":"Messaging Freshness Check","type":"Workflow","wedge":"W4","what":"Checks sales decks, email templates and talk tracks against the current product, flags every mention of a retired feature or outdated claim, and tells the content owner what to change, so reps stop promising what the product no longer does.","how":["Each time a feature is retired, plus a monthly sweep","The workflow reads release notes and product docs to list retired and renamed features","It scans decks, one-pagers, email templates, call scripts and recent call transcripts (to confirm)","It lists each outdated line with its location, the evidence that it's retired and a suggested replacement","Content owners approve fixes; sales enablement follows up with reps who still promise retired features."],"data":"Public release notes, product docs and pricing pages; internal retirement notices, sales decks, email templates, call scripts and call transcripts (all to confirm).","who":"Product marketing or strategy owns it; product managers confirm what is retired; content owners fix assets; sales enablement coaches reps on what changed.","first":"One scan of the ten most-used sales assets and email templates against the past year's retirements, giving product marketing a list of outdated lines to check.","measure":"Outdated lines found and fixed each month; mentions of retired features in recent sales calls, before and after.","ask":"When a feature is retired, how does sales find out, and who updates the decks?","problems":[{"id":"s3-21","card":"Sales still pitches features we retired","statement":"The sales team uses old messaging and promises features the product no longer offers.","how":"It matches each retired feature against decks, templates and recent call transcripts, so outdated slides get fixed and enablement can coach the reps still promising it.","ask":"Which retired feature do you still hear promised in sales calls, and where did reps learn it?","roles":["Strategy & market intelligence"]}]},{"id":"A23","name":"Customer Risk Watch","type":"Agent","wedge":"W3","what":"Reviews every account on a schedule and raises the few showing early risk, including clients the customer report shows as healthy, with the evidence behind each flag, so a CSM can act months before renewal.","how":["Weekly, the agent reads usage trends, support tickets and replies after closure, contact changes, meeting notes and survey comments (sources to confirm)","It flags accounts whose pattern looks like past churn, including ones the customer report rates healthy, and closed tickets that look unfixed","Each flag carries dated evidence, what's still unknown, a suggested owner and a first action","The CS manager reviews the list before anyone reaches out."],"data":"Product usage, support tickets and later replies, CRM contacts and notes, survey comments, the customer report or health scores, renewal dates (all private, access to confirm).","who":"CS Ops owns it; CSMs act on flags; support leads follow up on closed tickets that look unfixed; RevOps and the CS leader review accuracy.","first":"Run it on last year's churned and renewed accounts to see whether it would have flagged churn earlier, including churned clients the customer report showed as healthy, before using it live.","measure":"Days of warning before churn; share of flags CSMs agree with, including those on accounts rated healthy.","ask":"Thinking of your last lost client, when was the first sign, and where did it show up?","problems":[{"id":"s1-15","card":"Catching churn signals too late","statement":"We notice the warning signs only after a client has started planning to leave.","how":"Compares each account's usage, tickets, contact changes and notes with the patterns seen before past churn, and raises dated warning signs for the CSM while there's time to act.","ask":"How far ahead of renewal do you usually learn a client is planning to leave?","roles":["Customer success & accounts"]},{"id":"s1-17","card":"Our reports don't show all unhappy clients","statement":"The customer report looks healthy even when some clients are frustrated or thinking about leaving.","how":"Checks accounts the customer report rates healthy against the client's own words in tickets, calls and surveys, and lists any showing frustration or talk of leaving, with quotes.","ask":"What goes into your customer report today, and which unhappy client did it last miss?","roles":["Customer success & accounts","Revenue & marketing ops"]},{"id":"s4-19","card":"Closed support tickets. Still-unhappy clients.","statement":"A ticket is marked resolved, but nobody checks whether the client feels the problem is actually fixed.","how":"After a ticket is marked resolved, checks the client's later replies, repeat tickets and use of the affected feature, and flags closures the client may not consider fixed.","ask":"After a ticket closes, how would you learn the client still thinks the problem isn't fixed?","roles":["Customer success & accounts"]}]},{"id":"A24","name":"Adoption & Check-in Planner","type":"Agent","wedge":"W3","what":"Gives each CSM a weekly list of clients to contact and why: unused seats, stalled setup, falling usage or a long gap since the last conversation. Each comes with a suggested question, so check-ins happen long before renewal.","how":["Weekly, the agent reads seat logins, setup progress, usage trends and the date of each client's last call or meeting (sources to confirm)","It compares each account with its paid seats, its own recent usage and the expected setup steps","It ranks the clients worth contacting, says what changed and what's still unknown, and drafts a check-in note","The CSM edits and sends it; nothing goes out automatically."],"data":"Product usage and seat logins, setup milestones, CRM contacts, call and meeting dates, renewal dates (all private, access to confirm).","who":"CS Ops owns the rules; CSMs and onboarding managers do the check-ins; the CS manager reviews who was contacted and what was learned.","first":"One CSM's accounts for a month: a weekly list with draft notes, compared with the clients that CSM would have contacted anyway.","measure":"Average days since each client's last call or meeting; seat use and setup completion after a check-in.","ask":"How do you decide which clients get a check-in this week, and what do you look at?","problems":[{"id":"s1-19","card":"Paid seats nobody is using","statement":"Clients pay for product access that sits unused, making the next renewal harder to justify.","how":"Counts paid seats with no recent logins at each account, names the teams holding them, and suggests a training or rollout session well before renewal.","ask":"How do you find out which teams at a client have paid seats nobody uses?","roles":["Customer success & accounts"]},{"id":"s2-16","card":"New clients get stuck during setup","statement":"A new customer can't finish getting started, and the blocker goes unnoticed or unresolved.","how":"Tracks each new client against the expected setup steps and flags anyone stalled, naming the stuck step, the likely blocker and who should help clear it.","ask":"Which setup step do new clients most often get stuck on, and who notices first?","roles":["Customer success & accounts"]},{"id":"s3-14","card":"Usage is dropping. Nobody checks in.","statement":"Clients are using the product less, but the account team doesn't contact them to find out why.","how":"Flags accounts whose usage fell below their own recent level, shows which features or teams dropped, and adds a check-in to the CSM's list to find out why.","ask":"When a client's usage drops, how long before someone contacts them to ask why?","roles":["Customer success & accounts"]},{"id":"s4-14","card":"Only talking to clients at renewal time","statement":"Regular check-ins don't happen, so we miss what's changed for a client until we ask them to renew.","how":"Tracks the time since each client's last call or meeting, adds a check-in to the CSM's list when it passes a limit you set, and notes what's changed since.","ask":"Outside renewal time, how often does each client hear from you, and who decides?","roles":["Customer success & accounts"]}]},{"id":"A25","name":"Champion & Leadership Change Response","type":"Agent","wedge":"W3","what":"Notices when a client's main contact leaves or a new leader arrives, then shows who else can keep the relationship going and which parts of the account plan may no longer hold.","how":["Weekly, the agent checks each client's key contacts and leaders against public profiles, company announcements and bounced emails (to confirm)","It verifies each change with a second source","For a departure, it ranks remaining contacts by their history with you; for a new leader, it compares their public priorities with the account plan","The account owner gets a note with suggested next steps to approve before any outreach."],"data":"Public profiles, company announcements, news and interviews; CRM contacts, email and meeting history, product use by person, account plans (to confirm).","who":"CS Ops owns the contact watchlist; the CS manager reviews notes on key accounts; the CSM or account owner acts on each one.","first":"Run it on past cases where a main contact left, checking whether its suggested backups match who actually kept the relationship going, then watch 30 live accounts for a month.","measure":"Days from a contact leaving to the first conversation with a new one; share of suggested backup contacts the account owner agrees with.","ask":"When your last main contact left a client, how did you find out, and who did you call next?","problems":[{"id":"s1-14","card":"Our main client contact left. Now what?","statement":"Our main contact leaves the company, and we don't know who can keep the relationship going.","how":"Ranks the people still at the client by meetings attended, emails exchanged and product use, and suggests who to approach first to keep the relationship going.","ask":"Besides your main contact, who else at a typical client knows your team well?","roles":["Customer success & accounts"]},{"id":"s3-15","card":"New client leadership changes the whole deal","statement":"A new leader brings different priorities, but our account plan still assumes nothing has changed.","how":"Summarizes the new leader's public priorities and past decisions, marks the account plan assumptions they may change, and suggests questions for the first meeting.","ask":"When a client gets a new leader, who updates your account plan, and when?","roles":["Customer success & accounts"]}]},{"id":"A26","name":"Expansion Readiness","type":"Agent","wedge":"W3","what":"Gives sales and customer success one shared view of which clients are ready to buy more, with the evidence for and against, a proposed owner for each opportunity and the best time to act.","how":["Weekly, the agent reads usage against plan limits, new users and teams, open issues and risk flags (sources to confirm), plus public job posts and news","It sorts accounts into ready, not yet and blocked, with evidence on both sides and what's unknown","It proposes an owner for each opportunity from the team's agreed rules","Sales and CS review the list together before anyone contacts the client."],"data":"Product usage and plan limits, new users by team, support tickets, risk flags, CRM opportunities and owners (to confirm); public job posts, news and leadership changes.","who":"RevOps sets the rules for who acts; CSMs and account executives review the list together; the named owner acts on each opportunity.","first":"A read-only list for one team's accounts, reviewed in a joint sales and CS meeting, with both teams marking where they disagree with the agent and why.","measure":"Time from a growth signal to an agreed owner; share of ready, not yet or blocked ratings both teams accept.","ask":"Thinking of your last expansion deal, who spotted it first, and was the timing right?","problems":[{"id":"s1-16","card":"Bad timing on cross-team expansion opportunities","statement":"Another team at an existing client could use our product, but we reach them too early or too late.","how":"Watches for signs another team needs you, like their hiring, a new leader or their staff trying your product, and suggests outreach once the current team is succeeding.","ask":"How do you find out that another team at a client could use your product?","roles":["Customer success & accounts"]},{"id":"s2-15","card":"Expansion leads get lost between sales and CS","statement":"Someone spots a chance to sell more to a client, but sales and customer success never agree who acts.","how":"Puts every chance to sell more, from either team, in one shared list with an owner proposed from your agreed rules, so someone named acts on each.","ask":"When CS spots a chance to sell more, who owns it today?","roles":["Customer success & accounts","Revenue & marketing ops"]},{"id":"s3-16","card":"Clients outgrow their plan before we notice","statement":"A client's use has grown beyond their current plan, but nobody spots the chance to offer a better fit.","how":"Compares each client's usage, seats and features against their current plan's limits, and flags accounts near or over them with the plan that would fit better.","ask":"How would you spot today which clients are near or past their plan's limits?","roles":["Customer success & accounts"]},{"id":"s4-20","card":"Sales and CS disagree on who's ready to expand","statement":"Sales sees a chance to sell more while customer success sees an account that still needs work.","how":"Shows growth signals and open problems side by side for each account, so sales and CS judge readiness from the same evidence and agree what needs fixing first.","ask":"When sales and CS disagree about an account, who makes the call, and based on what?","roles":["Customer success & accounts","Revenue & marketing ops"]}]},{"id":"A27","name":"Renewal & Review Prep","type":"Agent","wedge":"W3","what":"Starts each renewal early with a brief and a draft review deck built from the client's own data. The brief names any doubts the client has, with evidence, so the CSM can resolve them before price comes up.","how":["When a contract end date or notice deadline enters the window the team chooses, the agent gathers usage, results, open tickets, contacts and call notes (sources to confirm)","It writes a renewal brief: value delivered, the client's doubts with evidence, and what's still unknown","It drafts review slides from the same facts","The CSM edits both and decides the renewal approach, including any discount, with their manager."],"data":"Contract end dates and notice terms, product usage, support tickets, CRM notes and call transcripts, past
