<script>
(function () {
  var LIB = window.LIB, view = document.getElementById('view'), cta = document.getElementById('cta');
  var agentsById = {}, problemsById = {};
  LIB.agents.forEach(function (a) { agentsById[a.id] = a; a.problems.forEach(function (p) { problemsById[p.id] = p; }); });
  var WEDGE = { W1: 'Account targeting', W2: 'Buyer readiness', W3: 'Customer risk & growth', W4: 'Market intelligence', W5: 'Operational intelligence', Platform: 'Running agents safely' };

  // Per-viewer memory: saved agents and private-link spaces. Wrapped because storage can be blocked.
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var saved = load('cotera-lib-saved', []), spaces = load('cotera-lib-spaces', []);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rich(s) { return esc(s).replace(/\([^()]*?to confirm\)/gi, '<span class="chip confirm">confirm access</span>'); }
  function wedgeChips(w) { return (w.match(/W[1-5]|Platform/g) || []).filter(function (x, i, arr) { return arr.indexOf(x) === i; }).map(function (k) { return '<span class="chip" title="Cotera wedge">' + esc(WEDGE[k]) + '</span>'; }).join(''); }
  function linkFor(id) { return LIB.links[id] || ''; }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }
  function updateTabs(route) {
    document.getElementById('tab-lib').setAttribute('aria-current', route === 'my' ? 'false' : 'page');
    document.getElementById('tab-my').setAttribute('aria-current', route === 'my' ? 'page' : 'false');
    var n = saved.length + spaces.reduce(function (s, c) { var sp = LIB.custom[c]; return s + (sp ? sp.agents.length : 0); }, 0);
    document.getElementById('my-count').innerHTML = n ? '<span class="n">' + n + '</span>' : '';
  }
  var SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  var HEART = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';

  function home() {
    cta.innerHTML = '';
    var roles = LIB.roles.map(function (r) {
      return '<a class="card" href="#/role/' + r.id + '"><span class="count">' + r.problems.length + ' problems</span><h2>' + esc(r.label) + '</h2><p class="muted">' + esc(r.description) + '</p></a>';
    }).join('');
    view.innerHTML =
      '<section class="hero"><span class="eyebrow">Cotera App Library</span><h1>Start from an agent that already works.</h1>' +
      '<p class="lede">Pick a problem your team deals with every week. Each one comes with a ready-made Cotera agent you can open in your own workspace and adapt.</p>' +
      '<label class="search">' + SEARCH_ICON + '<input id="q" type="search" placeholder="Search a problem, e.g. duplicates in the CRM" aria-label="Search problems and agents" autocomplete="off"></label></section>' +
      '<div id="results"></div>' +
      '<section class="section" id="browse"><div class="steps3"><div><b>1 · FIND</b>Pick the problem that sounds like your week.</div><div><b>2 · SEE</b>See the agent: what it does and how to start small.</div><div><b>3 · OPEN</b>Open it in your Cotera workspace and adapt it.</div></div>' +
      '<h2>Browse by team</h2><div class="grid">' + roles + '</div>' +
      '<p><a class="btn ghost small" href="#/agents">See all ' + LIB.agents.length + ' agents</a></p></section>';
    var q = document.getElementById('q');
    q.addEventListener('input', function () { searchResults(q.value); });
  }

  function searchResults(text) {
    var box = document.getElementById('results'), browse = document.getElementById('browse');
    var STOP = ['a','an','and','are','for','in','is','of','on','or','our','the','to','we','with','my','too','many','not'];
    var words = text.toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/).filter(function (w) { return w && STOP.indexOf(w) === -1; }).map(function (w) { return w === 'duplicates' || w === 'duplicate' ? 'dup' : (w.length > 4 && /s$/.test(w) ? w.slice(0, -1) : w); });
    if (!words.length) { box.innerHTML = ''; browse.hidden = false; return; }
    function hit(s) { s = s.toLowerCase(); return words.every(function (w) { return s.indexOf(w) > -1; }); }
    var probs = [], agents = [];
    LIB.agents.forEach(function (a) {
      a.problems.forEach(function (p) { if (hit(p.card + ' ' + p.statement)) probs.push({ a: a, p: p }); });
      if (hit(a.name + ' ' + a.what)) agents.push(a);
    });
    browse.hidden = true;
    box.innerHTML = '<section class="section"><span class="eyebrow">' + (probs.length + agents.length) + ' results</span><div class="list">' +
      probs.slice(0, 30).map(function (x) { return '<a class="row" href="#/agent/' + x.a.id + '/' + x.p.id + '"><span><span class="title">' + esc(x.p.card) + '</span><br><span class="sub">' + esc(x.a.name) + '</span></span><span class="arrow" aria-hidden="true">›</span></a>'; }).join('') +
      agents.slice(0, 12).map(function (a) { return '<a class="row" href="#/agent/' + a.id + '"><span><span class="title">' + esc(a.name) + '</span><br><span class="sub">' + esc(a.what) + '</span></span><span class="arrow" aria-hidden="true">›</span></a>'; }).join('') +
      (probs.length + agents.length ? '' : '<div class="empty"><h3>No match yet</h3><p class="muted">Try a shorter word, or browse by team below.</p></div>') + '</div></section>';
  }

  function role(id) {
    cta.innerHTML = '';
    var r = LIB.roles.filter(function (x) { return x.id === id; })[0];
    if (!r) return notFound();
    view.innerHTML = '<a class="back" href="#/">‹ All teams</a><section class="section"><span class="eyebrow">' + r.problems.length + ' problems</span><h1>' + esc(r.label) + '</h1><p class="muted">' + esc(r.description) + '. Tap the one that sounds most like your week.</p><div class="list">' +
      r.problems.map(function (p) { var a = agentsById[p.agent]; return '<a class="row" href="#/agent/' + a.id + '/' + p.id + '"><span><span class="title">' + esc(p.card) + '</span><br><span class="sub">' + esc(p.statement) + '</span></span><span class="arrow" aria-hidden="true">›</span></a>'; }).join('') +
      '</div></section>';
  }

  function allAgents() {
    cta.innerHTML = '';
    view.innerHTML = '<a class="back" href="#/">‹ Library</a><section class="section"><h1>All agents</h1><p class="muted">Each agent solves one or more related problems.</p><div class="grid">' +
      LIB.agents.map(agentCard).join('') + '</div></section>';
  }
  function agentCard(a, href) {
    return '<a class="card" href="' + (href || '#/agent/' + a.id) + '"><div class="chips"><span class="chip plain">' + esc(a.type) + '</span></div><h3>' + esc(a.name) + '</h3><p class="muted">' + esc(a.what) + '</p></a>';
  }

  function agentPage(a, problemId, custom) {
    var p = problemId && a.problems.filter(function (x) { return x.id === problemId; })[0];
    var steps = a.how.map(function (s) { return '<li><span>' + rich(s) + '</span></li>'; }).join('');
    var solves = a.problems.length ? '<div class="block"><h3>Problems it solves</h3><div class="solves">' + a.problems.map(function (x) {
      return '<a class="' + (p && x.id === p.id ? 'current' : '') + '" href="' + (custom ? '#/custom/' + custom + '/' + a.id : '#/agent/' + a.id + '/' + x.id) + '"><span class="t">' + esc(x.card) + '</span><span class="h">' + rich(x.how) + '</span></a>';
    }).join('') + '</div></div>' : '';
    view.innerHTML = '<a class="back" href="' + (custom ? '#/my' : 'javascript:history.back()') + '">‹ Back</a>' +
      '<article class="agent">' +
      '<div class="agent-head"><div class="chips"><span class="chip plain">' + esc(a.type) + '</span>' + wedgeChips(a.wedge || '') + (custom ? '<span class="chip">Made for you</span>' : '') + '</div>' +
      '<h1>' + esc(a.name) + '</h1><p class="what">' + rich(a.what) + '</p></div>' +
      (p ? '<div class="your-problem"><span class="eyebrow">Your problem</span><p class="q">' + esc(p.card) + '</p><p class="muted">' + esc(p.statement) + '</p><p class="how"><strong>How this agent helps:</strong> ' + rich(p.how) + '</p></div>' : '') +
      '<div class="cols"><div class="stack"><div class="block"><h3>How it works</h3><ol class="flow">' + steps + '</ol></div>' + solves + '</div>' +
      '<div class="panel"><div class="block"><h3>Start small</h3><p>' + rich(a.first) + '</p></div>' +
      '<div class="block"><h3>What it needs</h3><p>' + rich(a.data) + '</p></div>' +
      '<div class="block"><h3>Who uses it</h3><p>' + rich(a.who) + '</p></div>' +
      '<div class="block"><h3>How you\'ll know it works</h3><p>' + rich(a.measure) + '</p></div>' +
      '<div class="block"><h3>A question to tailor it</h3><p>' + esc((p && p.ask) || a.ask) + '</p></div></div></div>' +
      '<p class="muted" style="font-size:14px"><span class="chip confirm">confirm access</span> marks data or permissions to check with your team before switching it on. Every agent starts with output a person reviews.</p>' +
      '</article>';
    var link = custom ? (a.link || '') : linkFor(a.id), isSaved = saved.indexOf(a.id) > -1;
    cta.innerHTML = '<div class="cta-bar"><div class="cta-inner">' +
      (link ? '<a class="btn primary" href="' + esc(link) + '" target="_blank" rel="noreferrer">Open in Cotera</a>' : '<a class="btn primary" href="#/get/' + (custom ? custom + ':' : '') + a.id + '">Get this agent</a>') +
      (custom ? '' : '<button class="icon-btn" id="save" aria-pressed="' + isSaved + '" aria-label="' + (isSaved ? 'Remove from My agents' : 'Save to My agents') + '">' + HEART + '</button>') +
      '</div></div>';
    var btn = document.getElementById('save');
    if (btn) btn.addEventListener('click', function () {
      var i = saved.indexOf(a.id);
      if (i > -1) saved.splice(i, 1); else saved.push(a.id);
      store('cotera-lib-saved', saved);
      btn.setAttribute('aria-pressed', i === -1); btn.setAttribute('aria-label', i === -1 ? 'Remove from My agents' : 'Save to My agents');
      toast(i === -1 ? 'Saved to My agents' : 'Removed from My agents'); updateTabs('agent');
    });
  }

  function getAgent(key) {
    var custom = key.indexOf(':') > -1 ? key.split(':')[0] : null, id = custom ? key.split(':')[1] : key;
    var a = custom ? (LIB.custom[custom] || { agents: [] }).agents.filter(function (x) { return x.id === id; })[0] : agentsById[id];
    if (!a) return notFound();
    cta.innerHTML = '';
    view.innerHTML = '<a class="back" href="javascript:history.back()">‹ Back</a><section class="section"><span class="eyebrow">Get this agent</span><h1>' + esc(a.name) + '</h1>' +
      '<p class="muted">Tell us where to set it up. We\'ll add it to your Cotera workspace, or send you a link to open it there.</p>' +
      '<form class="form" id="req"><label>Your name<input name="name" required autocomplete="name"></label>' +
      '<label>Work email<input name="email" type="email" required autocomplete="email"></label>' +
      '<label>Company<input name="company" required autocomplete="organization"></label>' +
      '<label>Anything we should adapt? <span class="muted">(optional)</span><textarea name="note" rows="3" placeholder="e.g. we use HubSpot, and our reps work named accounts"></textarea></label>' +
      '<button class="btn primary" type="submit">Request this agent</button><p class="proto">Prototype: requests are not sent anywhere yet.</p></form></section>';
    document.getElementById('req').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!custom && saved.indexOf(a.id) === -1) { saved.push(a.id); store('cotera-lib-saved', saved); updateTabs('agent'); }
      view.innerHTML = '<section class="section"><span class="eyebrow">Request received</span><h1>You\'re on the list.</h1><p class="muted">We\'ll set up <strong>' + esc(a.name) + '</strong> in your Cotera workspace and email you when it\'s ready. It\'s saved in My agents in the meantime.</p>' +
        '<p class="proto">Prototype: nothing was sent.</p><p><a class="btn ghost small" href="#/my">Go to My agents</a> <a class="btn ghost small" href="#/">Keep browsing</a></p></section>';
    });
  }

  function my() {
    cta.innerHTML = '';
    var html = '<section class="section"><span class="eyebrow">My agents</span><h1>Your starting points.</h1></section>';
    spaces.forEach(function (code) {
      var sp = LIB.custom[code]; if (!sp) return;
      html += '<section class="section"><div class="made-for"><span class="eyebrow">Made for ' + esc(sp.for) + '</span><h2>' + esc(sp.title) + '</h2><p>' + esc(sp.note) + '</p></div><div class="grid">' +
        sp.agents.map(function (a) { return agentCard(a, '#/custom/' + code + '/' + a.id); }).join('') +
        (sp.library || []).map(function (id) { return agentsById[id] ? agentCard(agentsById[id]) : ''; }).join('') + '</div></section>';
    });
    var mine = saved.map(function (id) { return agentsById[id]; }).filter(Boolean);
    html += '<section class="section"><h2>Saved</h2>' + (mine.length ? '<div class="grid">' + mine.map(function (a) { return agentCard(a); }).join('') + '</div>' :
      '<div class="empty"><h3>Nothing saved yet</h3><p class="muted">Tap the heart on any agent to keep it here. If someone from Cotera made agents for you, open the private link they sent and they\'ll appear on this page.</p><p><a class="btn ghost small" href="#/">Browse the library</a></p></div>') + '</section>';
    view.innerHTML = html;
  }

  function openSpace(code) {
    if (!LIB.custom[code]) { cta.innerHTML = ''; view.innerHTML = '<section class="section"><h1>This link isn\'t recognised.</h1><p class="muted">Check the link you were sent, or browse the library.</p><p><a class="btn ghost small" href="#/">Browse the library</a></p></section>'; return; }
    if (spaces.indexOf(code) === -1) { spaces.push(code); store('cotera-lib-spaces', spaces); }
    location.replace('#/my');
  }

  function notFound() { cta.innerHTML = ''; view.innerHTML = '<section class="section"><h1>Page not found.</h1><p><a class="btn ghost small" href="#/">Back to the library</a></p></section>'; }

  function route() {
    var parts = (location.hash.replace(/^#\/?/, '') || '').split('/');
    var r = parts[0] || '';
    if (r === '') home();
    else if (r === 'role') role(parts[1]);
    else if (r === 'agents') allAgents();
    else if (r === 'agent' && agentsById[parts[1]]) agentPage(agentsById[parts[1]], parts[2]);
    else if (r === 'custom' && LIB.custom[parts[1]]) { var a = LIB.custom[parts[1]].agents.filter(function (x) { return x.id === parts[2]; })[0]; if (a) agentPage(a, null, parts[1]); else notFound(); }
    else if (r === 'get') getAgent(decodeURIComponent(parts[1] || ''));
    else if (r === 'my') my();
    else if (r === 'for') openSpace(parts[1]);
    else notFound();
    updateTabs(r === 'my' ? 'my' : r);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
