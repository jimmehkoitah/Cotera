<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotera App Library</title>
<meta name="description" content="Ready-made Cotera agents for the problems GTM teams deal with every week.">
<meta name="theme-color" content="#f7f5f0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Newsreader-opsz.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Cotera brand fonts, served with the site (licences in fonts/). Newsreader keeps its optical sizes, so headlines use the display cut. */
@font-face { font-family: "Inter"; src: url("fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Inter"; src: url("fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Newsreader"; src: url("fonts/Newsreader-opsz.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }

/* Cotera's design system, as on the GTMxAI event site: ivory paper, white surfaces, hairline rules and one blue.
   Flat on purpose: no shadows or blur. Structure comes from rules, the warm layer fill and solid blue for emphasis.
   The Cotera logo only sits on ivory or white. */
:root {
  --ivory: #f7f5f0; --surface: #ffffff; --rule: #e6e2d9; --rule-strong: #bdb8ab; --layer: #ebe8de; --layer-rule: #dcd7ca;
  --blue: #385295; --blue-hover: #2f4580; --on-blue: #ffffff; --blue-soft: #e8ecf6; --part-line: #9eadd3;
  --ink: #1e2433; --slate: #576280; --label: #6b7590;
  --line: 1.5px solid var(--rule);
  --tabs-h: 61.5px;
  --sans: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; font-synthesis-weight: none; }
html, body { margin: 0; }
body { background: var(--ivory); color: var(--ink); font: 400 16px/1.55 var(--sans); letter-spacing: -.011em; text-wrap: pretty; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
strong, b { font-weight: 500; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#view:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px calc(var(--tabs-h) + 30px + env(safe-area-inset-bottom, 0px)); }
body.has-cta .wrap { padding-bottom: calc(var(--tabs-h) + 98px + env(safe-area-inset-bottom, 0px)); } /* room for the button bar above the tabs */
@media (min-width: 720px) { .wrap { padding-inline: 28px; } }

/* Header: logo on ivory, the product name in blue mono, the search field, and a rule underneath. */
header.top { display: grid; gap: 14px; padding: 16px 0; border-bottom: var(--line); }
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; padding: 4px 0; text-decoration: none; }
.brand svg { height: 26px; width: auto; display: block; }
.brand-tag { font: 400 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--blue); }
@media (min-width: 720px) {
  header.top { grid-template-columns: auto minmax(0, 400px); justify-content: space-between; align-items: center; padding: 22px 0; }
  .masthead { justify-content: flex-start; gap: 18px; }
  .brand-tag { padding-left: 18px; border-left: var(--line); }
}
.search { position: relative; margin: 0; }
.search input { width: 100%; height: 46px; padding: 0 44px 0 42px; border-radius: 14px; border: var(--line); background: var(--surface); font: 400 16px var(--sans); color: var(--ink); -webkit-appearance: none; appearance: none; transition: border-color .2s, box-shadow .2s; }
.search input::placeholder { color: #737b92; }
.search input:placeholder-shown { padding-right: 16px; } /* no clear button while empty */
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.search > svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--label); pointer-events: none; }
.search .clear { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--layer); color: var(--slate); cursor: pointer; }
.search .clear[hidden] { display: none; }

/* Type: blue serif headlines, slate text with ink for emphasis, mono labels followed by a rule. */
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 400 clamp(34px, 9vw, 56px)/1.03 var(--serif); letter-spacing: -.01em; color: var(--blue); }
h1.search-h { font-size: clamp(28px, 7.4vw, 40px); overflow-wrap: anywhere; }
h2 { font: 400 clamp(24px, 6.2vw, 32px)/1.1 var(--serif); letter-spacing: -.01em; color: var(--blue); }
h3 { font: 500 16px/1.35 var(--sans); }
p { margin: 0; text-wrap: pretty; }
.muted { color: var(--slate); }
.fine { font-size: 14px; line-height: 1.5; letter-spacing: -.005em; color: var(--slate); }
.eyebrow { display: flex; align-items: center; gap: 12px; margin: 0; font: 400 11px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--label); }
.eyebrow::after { content: ""; flex: 1; min-width: 24px; height: 1.5px; background: var(--rule); }
.made-for .eyebrow::after, .your-problem .eyebrow::after { display: none; }
.stack { display: grid; gap: 12px; }
.section { display: grid; gap: 16px; padding-block: 22px; }
.hero { display: grid; gap: 16px; padding-block: 28px 6px; }
.hero .lede { font-size: 17px; line-height: 1.5; color: var(--slate); max-width: 46ch; }

/* Find / See / Open: one white strip divided by rules, with outlined numbers. */
.steps { list-style: none; margin: 0; padding: 0; display: grid; background: var(--surface); border: var(--line); border-radius: 16px; }
.steps li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; align-items: start; padding: 16px 18px; }
.steps li + li { border-top: var(--line); }
.steps .n { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--blue); background: var(--surface); color: var(--blue); display: grid; place-items: center; font: 400 12px/1 var(--mono); letter-spacing: 0; }
.steps b { display: block; font: 400 21px/1.15 var(--serif); letter-spacing: -.01em; color: var(--blue); }
.steps .t { display: block; margin-top: 3px; font-size: 15px; line-height: 1.45; color: var(--slate); }
@media (min-width: 720px) { .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } .steps li { grid-template-columns: 1fr; padding: 22px 24px; } .steps li + li { border-top: 0; border-left: var(--line); } }

/* Team tiles: warm layer cards. */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }
.card.tile { min-height: 104px; align-content: space-between; gap: 12px; padding: 15px 15px 16px; background: var(--layer); border-color: var(--layer); }
.tile .count { font: 400 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
.tile h2 { font-size: 19.5px; line-height: 1.14; color: var(--ink); text-wrap: pretty; }
@media (min-width: 720px) { .tile h2 { font-size: 22px; } }
.card.tile p { display: none; font-size: 14px; line-height: 1.45; color: var(--slate); }
@media (min-width: 720px) { .card.tile { min-height: 150px; align-content: start; gap: 8px; } .card.tile p { display: block; } }

/* Cards: white with a hairline; agent names in blue serif. */
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.card { display: grid; gap: 8px; padding: 18px; border-radius: 16px; background: var(--surface); border: var(--line); text-decoration: none; min-width: 0; transition: border-color .15s; }
.card h3 { font: 400 22px/1.15 var(--serif); letter-spacing: -.01em; color: var(--blue); }
.card p { font-size: 14.5px; line-height: 1.5; color: var(--slate); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@media (hover: hover) { a.card:hover { border-color: var(--rule-strong); } a.card.tile:hover { border-color: var(--rule-strong); } }
a.card:active { border-color: var(--blue); }

/* Lists: ruled rows, blue serif titles, like the short-answers slide. */
.list { display: grid; border-bottom: var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 16px; gap: 14px; align-items: center; padding: 15px 2px 16px; border-top: var(--line); text-decoration: none; transition: opacity .15s; }
.row .txt { display: grid; gap: 4px; min-width: 0; }
.row .title { font: 400 19.5px/1.22 var(--serif); letter-spacing: -.008em; color: var(--blue); }
.row .sub { font-size: 14.5px; line-height: 1.45; color: var(--slate); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.row .arrow { display: grid; color: var(--blue); }
a.row:active { opacity: .6; }
@media (hover: hover) { a.row:hover .title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; } }

/* Labels: mono text separated by dots, no pills. Search suggestions are white pills with a hairline. */
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; }
.chip { font: 400 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
.chips .chip + .chip::before { content: "·"; padding: 0 10px; color: var(--rule-strong); }
.chip.plain, .chip.made { color: var(--blue); }
a.chip { padding: 9px 14px; margin: 0 8px 8px 0; border: var(--line); border-radius: 999px; background: var(--surface); font: 400 14px/1 var(--sans); letter-spacing: -.005em; text-transform: none; color: var(--blue); text-decoration: none; }
.chips a.chip + a.chip::before { content: none; }
@media (hover: hover) { a.chip:hover { border-color: var(--blue); } }
.chip.confirm { display: inline-block; padding: 3px 7px; border-radius: 999px; font-size: 9.5px; letter-spacing: .06em; color: #7a4e00; background: #fff1d2; border: 1px solid rgba(122, 78, 0, .18); vertical-align: 1px; }
.back { display: inline-flex; align-items: center; gap: 2px; padding: 18px 4px 2px 0; text-decoration: none; color: var(--blue); font: 500 14.5px/1.3 var(--sans); }
.back svg { flex: none; margin-left: -4px; }
.back-end { margin-top: 12px; border-top: var(--line); }

/* Agent page */
.agent { display: grid; gap: 22px; padding-block: 10px 16px; }
.agent-head { display: grid; gap: 14px; }
.agent-head .what { font-size: 17px; line-height: 1.55; color: var(--slate); max-width: 62ch; }
.your-problem { display: grid; gap: 8px; padding: 18px 18px 20px; border-radius: 16px; background: var(--layer); }
.your-problem .q { font: 400 24px/1.15 var(--serif); letter-spacing: -.01em; color: var(--ink); }
.your-problem .how { border-top: 1.5px solid var(--layer-rule); padding-top: 12px; margin-top: 4px; font-size: 15.5px; color: var(--slate); }
.your-problem .how strong { color: var(--ink); }
.cols { display: grid; gap: 24px; }
@media (min-width: 860px) { .cols { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
.block { display: grid; gap: 10px; }
.block h3 { font: 400 11px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--label); }
.block p { font-size: 15.5px; line-height: 1.55; color: var(--slate); }
ol.flow { list-style: none; margin: 0; padding: 0; display: grid; counter-reset: s; }
ol.flow li { counter-increment: s; position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; padding-bottom: 18px; font-size: 15.5px; line-height: 1.5; color: var(--ink); }
ol.flow li::before { content: counter(s, decimal-leading-zero); width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--blue); background: var(--surface); color: var(--blue); display: grid; place-items: center; font: 400 12px/1 var(--mono); letter-spacing: 0; }
ol.flow li:not(:last-child)::after { content: ""; position: absolute; left: 15.25px; top: 36px; bottom: 4px; width: 1.5px; background: var(--part-line); }
.panel { display: grid; padding: 2px 18px; border-radius: 16px; background: var(--surface); border: var(--line); }
.panel .block { padding: 16px 0; }
.panel .block + .block { border-top: var(--line); }
.solves { display: grid; border-radius: 16px; background: var(--surface); border: var(--line); overflow: hidden; }
.solves a { display: grid; gap: 4px; padding: 14px 16px; text-decoration: none; transition: background-color .15s; }
.solves a + a { border-top: var(--line); }
.solves a.current { background: var(--layer); }
.solves .t { font: 400 18.5px/1.22 var(--serif); letter-spacing: -.008em; color: var(--blue); }
.solves .h { font-size: 14px; line-height: 1.45; color: var(--slate); }
@media (hover: hover) { .solves a:not(.current):hover { background: var(--ivory); } }

/* Bottom bars: solid white with a hairline. The agent's button bar sits on the tabs. */
.cta-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); padding: 10px 16px; background: var(--ivory); border-top: var(--line); z-index: 5; }
.cta-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 12px; border: 1.5px solid transparent; font: 500 15px/1 var(--sans); text-decoration: none; cursor: pointer; transition: background-color .15s, border-color .15s; }
.btn.primary { flex: 1; background: var(--blue); color: var(--on-blue); }
@media (hover: hover) { .btn.primary:hover { background: var(--blue-hover); } .btn.ghost:hover { border-color: var(--blue); } }
.btn:active { opacity: .85; }
.btn.ghost { background: var(--surface); border-color: var(--rule); color: var(--blue); }
.btn.small { height: 40px; padding: 0 16px; font-size: 14px; }
.icon-btn { flex: none; width: 46px; height: 46px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--blue); background: var(--surface); border: 1.5px solid var(--rule); }
.icon-btn svg { fill: none; stroke: currentColor; stroke-width: 1.7; }
.icon-btn[aria-pressed="true"] { color: var(--on-blue); background: var(--blue); border-color: var(--blue); }
.icon-btn[aria-pressed="true"] svg { fill: currentColor; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 8px env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: var(--line); z-index: 6; }
.tab { position: relative; flex: 0 1 160px; height: 60px; display: grid; justify-items: center; align-content: center; gap: 6px; text-decoration: none; font: 400 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
.tab svg { width: 20px; height: 20px; }
.tab[aria-current="page"] { color: var(--blue); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1.5px; left: 24%; right: 24%; height: 3px; border-radius: 0 0 2px 2px; background: var(--blue); }
.tab .n { margin-left: 5px; padding: 2px 5px; border-radius: 999px; font: 400 9.5px/1 var(--mono); letter-spacing: 0; color: var(--on-blue); background: var(--blue); }

/* Forms, empty states, toast */
.empty { display: grid; gap: 10px; padding: 20px; border-radius: 16px; background: var(--surface); border: var(--line); }
.form { display: grid; gap: 14px; padding: 18px; border-radius: 16px; background: var(--surface); border: var(--line); }
.form label { display: grid; gap: 6px; font-size: 14px; color: var(--ink); }
.form input, .form textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: var(--line); background: var(--ivory); font: 400 16px/1.4 var(--sans); color: var(--ink); }
.form input:focus, .form textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.proto { font: 400 10.5px/1.5 var(--mono); letter-spacing: .06em; color: var(--label); }
.made-for { display: grid; gap: 8px; padding: 22px 20px; border-radius: 28px; color: var(--on-blue); background: var(--blue); }
.made-for h2 { color: var(--on-blue); }
.made-for p { color: var(--on-blue); font-size: 15px; }
.made-for .eyebrow { color: var(--on-blue); opacity: .85; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; font: 500 13.5px/1.2 var(--sans); color: var(--on-blue); white-space: nowrap; background: var(--ink); z-index: 10; }

/* Pages ease in when opened (not while typing a search). */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#view.enter > * { animation: rise .32s cubic-bezier(.2, .7, .2, 1) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="masthead"><a class="brand" href="#/" aria-label="Cotera App Library home">__LOGO__</a><span class="brand-tag">App Library</span></div>
    <form class="search" id="search-form" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search problems and agents" aria-label="Search the library" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="q-clear" type="button" aria-label="Clear search" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </form>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div id="cta"></div>
<nav class="tabs" aria-label="Sections">
  <a class="tab" id="tab-lib" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Library</a>
  <a class="tab" id="tab-search" href="#/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>Search</a>
  <a class="tab" id="tab-my" href="#/my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>My agents<span id="my-count"></span></span></a>
</nav>
<script>
window.LIB = __DATA__;
</script>
<script>
(function () {
  var LIB = window.LIB, view = document.getElementById('view'), cta = document.getElementById('cta');
  var q = document.getElementById('q'), qClear = document.getElementById('q-clear');
  var agentsById = {}, rolesById = {};
  LIB.agents.forEach(function (a) { agentsById[a.id] = a; });
  LIB.roles.forEach(function (r) { rolesById[r.id] = r; });
  var WEDGE = { W1: 'Account targeting', W2: 'Buyer readiness', W3: 'Customer risk & growth', W4: 'Market intelligence', W5: 'Operational intelligence', Platform: 'Running agents safely' };

  // Per-viewer memory: saved agents and the private pages opened on this device. Wrapped because storage can be blocked.
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var saved = load('cotera-lib-saved', []), spaces = load('cotera-lib-spaces', []), spaceData = load('cotera-lib-space-data', {}), missing = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rich(s) { return esc(s).replace(/\([^()]*?to confirm\)/gi, '<span class="chip confirm">confirm access</span>'); }
  function wedgeKeys(w) { return (String(w || '').match(/W[1-5]|Platform/g) || []).filter(function (x, i, arr) { return arr.indexOf(x) === i; }); }
  function wedgeChips(w) { return wedgeKeys(w).map(function (k) { return '<span class="chip" title="Cotera wedge">' + esc(WEDGE[k]) + '</span>'; }).join(''); }
  function linkFor(id) { return LIB.links[id] || ''; }
  function setTitle(t) { document.title = (t ? t + ' · ' : '') + 'Cotera App Library'; }
  function decode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  function customAgent(code, id) { var sp = spaceData[code]; return sp ? sp.agents.filter(function (x) { return x.id === id; })[0] : null; }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }
  var NEXT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

  function openSpace(code) {
    withSpace(code, function (sp) {
      if (!sp) {
        cta.innerHTML = ''; setTitle('Link not recognised');
        view.innerHTML = back('#/', 'Library') + '<section class="section"><h1>This link isn\'t recognised.</h1><p class="muted">Check the link you were sent, or browse the library.</p><p><a class="btn ghost small" href="#/">Browse the library</a></p></section>';
        return;
      }
      if (spaces.indexOf(code) === -1) { spaces.push(code); store('cotera-lib-spaces', spaces); }
      go('#/my', true);
    });
  }

  function notFound() { cta.innerHTML = ''; setTitle('Page not found'); view.innerHTML = back('#/', 'Library') + '<section class="section"><h1>Page not found.</h1><p class="muted">The link may be out of date. Search above, or go back to the library.</p><p><a class="btn ghost small" href="#/">Back to the library</a></p></section>'; }

  function route() {
    var parts = current.replace(/^#\/?/, '').split('/'), r = parts[0] || '';
    if (r === 'search') {
      var text = decode(current.replace(/^#\/search\/?/, ''));
      if (q.value.trim() !== text.trim()) q.value = text;
    } else q.value = '';
    qClear.hidden = !q.value;
    if (r === '') home();
    else if (r === 'search') search(text);
    else if (r === 'role') role(parts[1]);
    else if (r === 'agents') allAgents();
    else if (r === 'agent' && agentsById[parts[1]]) agentPage(agentsById[parts[1]], parts[2]);
    else if (r === 'custom') customPage(parts[1] || '', parts[2]);
    else if (r === 'get') getAgent(decode(parts[1] || ''));
    else if (r === 'my') my();
    else if (r === 'for' && parts[1]) openSpace(parts[1]);
    else notFound();
    document.body.classList.toggle('has-cta', !!cta.firstChild);
    updateTabs();
  }

  if (!history.state) history.replaceState({ from: null }, '');
  show(true);
  refreshSpaces();
})();
</script>
</body>
</html>
