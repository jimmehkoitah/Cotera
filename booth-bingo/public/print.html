<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTM Pain Bingo · QR card</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="print">
  <main>
    <div class="wordmark">Cotera</div>
    <div class="big">GTM Pain Bingo</div>
    <p class="sub">Claim the GTM pain you actually have.</p>
    <img class="qr" src="/qr.svg" alt="QR code to join the game">
    <div class="url" id="url"></div>
    <p class="prize">Tap a square, tell Jim about it, and win a <strong>Coco by Cotera</strong> hot chocolate kit.</p>
    <p class="noprint"><button class="btn dark" type="button" id="printBtn">Print this card</button></p>
  </main>
  <script src="/print.js"></script>
</body>
</html>
